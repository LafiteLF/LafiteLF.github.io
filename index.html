<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <!-- 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Markdown解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 基础样式与 Liquid Glass 效果 --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --text-color: #ffffff;
            --primary-color: #ff7eb3;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 玻璃拟态通用类 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            margin: 20px;
            width: 80%;
            max-width: 800px;
            transition: transform 0.2s;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        /* 头部 */
        header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transition: transform 0.5s;
        }
        .avatar:hover { transform: rotate(360deg); }

        h1 { margin: 15px 0 5px; font-weight: 300; letter-spacing: 2px; }
        .subtitle { font-size: 0.9em; opacity: 0.8; }

        /* 文章列表 */
        .post-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
        }
        .post-item:hover { background: rgba(255,255,255,0.1); }
        .post-date { font-size: 0.8em; opacity: 0.6; margin-left: 10px; }

        /* 文章内容区域 */
        #content-area { display: none; text-align: left; line-height: 1.8; }
        #content-area img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        #content-area pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; overflow-x: auto; }

        /* 底部导航 */
        .nav-bar {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 15px;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: bold;
        }

        /* 模态框 (归档/下载) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
            opacity: 0.7;
        }
        .close-btn:hover { opacity: 1; }

        /* 下载列表样式 */
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            color: white;
            transition: background 0.2s;
        }
        .file-item:hover { background: rgba(255,255,255,0.1); }
        .file-icon { font-size: 24px; margin-right: 15px; width: 30px; text-align: center; }
        .file-name { flex-grow: 1; font-size: 1.1rem; }
        .file-size { font-size: 0.8rem; opacity: 0.6; margin-left: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 头部 -->
    <header>
        <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar" class="avatar">
        <h1>LafiteLF's Blog</h1>
        <p class="subtitle">探索数字边界 · 记录生活点滴</p>
    </header>

    <!-- 主要内容区域 (博客文章) -->
    <main id="main-container">
        <!-- 文章列表或内容将在这里渲染 -->
    </main>

    <!-- 底部导航 -->
    <nav class="nav-bar">
        <button class="nav-btn active" onclick="loadHome()"><i class="fas fa-home"></i> 首页</button>
        <button class="nav-btn" onclick="openArchive()"><i class="fas fa-archive"></i> 归档</button>
        <button class="nav-btn" onclick="openDownloads()"><i class="fas fa-download"></i> 下载</button>
        <button class="nav-btn" onclick="window.open('https://github.com/LafiteLF', '_blank')"><i class="fab fa-github"></i></button>
    </nav>

    <!-- 归档模态框 -->
    <div id="archive-modal" class="modal">
        <div class="glass-panel modal-content">
            <span class="close-btn" onclick="closeModal('archive-modal')">&times;</span>
            <h2><i class="fas fa-book"></i> 文章归档</h2>
            <div id="archive-list"></div>
        </div>
    </div>

    <!-- 下载模态框 -->
    <div id="download-modal" class="modal">
        <div class="glass-panel modal-content">
            <span class="close-btn" onclick="closeModal('download-modal')">&times;</span>
            <h2><i class="fas fa-cloud-download-alt"></i> 资源下载</h2>
            <p style="font-size: 0.9em; opacity: 0.8; margin-bottom: 20px;">点击文件名即可下载</p>
            <div id="download-list">
                <!-- 文件列表由JS生成 -->
                <div style="text-align:center; padding: 20px;">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // --- 配置区域 ---
        const GITHUB_USER = 'LafiteLF';
        const REPO_NAME = 'LafiteLF.github.io'; // 请确认你的仓库名
        const BLOG_PATH = 'blog';
        const DOWNLOAD_PATH = 'download';

        // --- 初始化 ---
        window.onload = function() {
            loadHome();
        };

        // --- 核心功能：加载首页 ---
        async function loadHome() {
            const container = document.getElementById('main-container');
            container.innerHTML = '<div style="text-align:center; margin-top:50px;"><i class="fas fa-spinner fa-spin fa-2x"></i><p>加载中...</p></div>';

            try {
                // 获取 blog 文件夹内容
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${BLOG_PATH}`);
                if (!response.ok) throw new Error('无法连接到GitHub API');

                const files = await response.json();
                // 过滤只保留 md 文件
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    container.innerHTML = '<div class="glass-panel"><h3>暂无文章</h3><p>请在仓库的 blog 文件夹中添加 .md 文件。</p></div>';
                    return;
                }

                // 生成列表
                let html = '';
                mdFiles.forEach(file => {
                    // 从文件名提取日期和标题 (假设格式: 2023-10-01-title.md)
                    const nameParts = file.name.replace('.md', '').split('-');
                    const date = nameParts.slice(0, 3).join('-');
                    const title = nameParts.slice(3).join(' ') || file.name.replace('.md', '');

                    html += `
                        <div class="glass-panel post-item" onclick="loadPost('${file.name}')">
                            <span>${title}</span>
                            <span class="post-date">${date}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="glass-panel" style="border-color: #ff6b6b;">
                        <h3><i class="fas fa-exclamation-triangle"></i> 加载失败</h3>
                        <p>${error.message}</p>
                        <p style="font-size:0.8em; margin-top:10px;">注意：请确保仓库根目录下有 <b>blog</b> 文件夹，且包含 .md 文件。</p>
                    </div>`;
            }
        }

        // --- 核心功能：加载文章 ---
        async function loadPost(filename) {
            const container = document.getElementById('main-container');
            container.innerHTML = '<div style="text-align:center; margin-top:50px;">加载中...</div>';

            try {
                // 获取文件内容
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${BLOG_PATH}/${filename}`);
                const data = await response.json();
                const content = atob(data.content); // 解码 Base64

                const htmlContent = marked.parse(content);

                container.innerHTML = `
                    <div class="glass-panel" id="content-area" style="display:block;">
                        <button onclick="loadHome()" style="background:none; border:none; color:white; cursor:pointer; margin-bottom:20px; font-size:1rem;">
                            <i class="fas fa-arrow-left"></i> 返回列表
                        </button>
                        <hr style="border-color:rgba(255,255,255,0.1); margin-bottom:20px;">
                        ${htmlContent}
                    </div>
                `;
            } catch (error) {
                container.innerHTML = '<p>读取文章失败</p>';
            }
        }

        // --- 功能：打开归档 ---
        async function openArchive() {
            const modal = document.getElementById('archive-modal');
            const listContainer = document.getElementById('archive-list');
            modal.style.display = 'flex';
            listContainer.innerHTML = '加载中...';

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${BLOG_PATH}`);
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                let html = '';
                mdFiles.forEach(file => {
                    const nameParts = file.name.replace('.md', '').split('-');
                    const date = nameParts.slice(0, 3).join('-');
                    const title = nameParts.slice(3).join(' ') || file.name.replace('.md', '');
                    html += `<div class="post-item" onclick="loadPost('${file.name}'); closeModal('archive-modal');">
                                <span>${title}</span>
                                <span class="post-date">${date}</span>
                             </div>`;
                });
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = '<p style="text-align:center; color:#ff6b6b;">加载失败</p>';
            }
        }

        // --- 新功能：打开下载面板 ---
        async function openDownloads() {
            const modal = document.getElementById('download-modal');
            const listContainer = document.getElementById('download-list');
            modal.style.display = 'flex';
            listContainer.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> 扫描文件中...</div>';

            try {
                // 读取 download 文件夹
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${DOWNLOAD_PATH}`);

                if (!response.ok) throw new Error('找不到 download 文件夹');

                const files = await response.json();

                if (files.length === 0) {
                    listContainer.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.6;">文件夹是空的</div>';
                    return;
                }

                let html = '';
                files.forEach(file => {
                    // 简单的图标逻辑
                    let iconClass = 'fa-file';
                    let color = '#fff';
                    const ext = file.name.split('.').pop().toLowerCase();

                    if (['jpg','jpeg','png','gif','webp'].includes(ext)) { iconClass = 'fa-image'; color = '#4facfe'; }
                    else if (['zip','rar','7z', 'tar', 'gz'].includes(ext)) { iconClass = 'fa-file-archive'; color = '#f093fb'; }
                    else if (['pdf'].includes(ext)) { iconClass = 'fa-file-pdf'; color = '#ff6b6b'; }
                    else if (['exe', 'msi'].includes(ext)) { iconClass = 'fa-windows'; color = '#4facfe'; }
                    else if (['md', 'txt', 'json', 'js', 'html', 'css'].includes(ext)) { iconClass = 'fa-code'; color = '#43e97b'; }

                    html += `
                        <a href="${file.html_url}?raw=true" class="file-item" target="_blank">
                            <i class="fas ${iconClass} file-icon" style="color:${color}"></i>
                            <span class="file-name">${file.name}</span>
                            <span class="file-size">${(file.size/1024).toFixed(1)} KB</span>
                        </a>
                    `;
                });
                listContainer.innerHTML = html;

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#ff6b6b;">
                        <i class="fas fa-exclamation-circle fa-2x"></i>
                        <p>无法加载下载列表</p>
                        <p style="font-size:0.8em;">请确保仓库根目录下有 <b>download</b> 文件夹</p>
                    </div>`;
            }
        }

        // --- 工具：关闭模态框 ---
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
