<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LafiteLF's Blog | 数字边界·生活点滴</title>
    <!-- 引入 marked.js 用于 Markdown 解析 (CDN 优化，带备用) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome 6 (免费图标库，用于增强UI但不依赖) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --accent: #ff7eb3;
            --blur: 16px;
            --duration: 0.4s;
            --ease: cubic-bezier(0.17, 0.67, 0.88, 1.01);
        }

        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 动画库 ===== */
        .animate-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity var(--duration) var(--ease), transform var(--duration) var(--ease);
        }
        .animate-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .animate-fade {
            opacity: 0;
            transition: opacity var(--duration) var(--ease);
        }
        .animate-fade.visible {
            opacity: 1;
        }

        .animate-slide-up {
            transform: translateY(100%);
            transition: transform var(--duration) var(--ease);
        }
        .animate-slide-up.visible {
            transform: translateY(0);
        }

        /* 移除未使用的 animate-pulse，精简代码 */
        
        /* ===== 顶部装饰头像 ===== */
        .top-decor {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: url('https://avatars.githubusercontent.com/u/187166523?s=96&v=4') no-repeat center/cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            z-index: 10;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        /* ===== 主布局 ===== */
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            margin-top: 120px;
            gap: 24px;
            flex: 1;
        }

        /* ===== 左侧：置顶公告面板 ===== */
        .left-panel {
            flex: 1;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            overflow-y: auto;
            position: relative;
            transition: all var(--duration) var(--ease);
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
        }

        .left-panel h2 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-primary);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--text-primary);
            margin-top: 1.5em;
        }
        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            position: relative;
        }
        .markdown-body a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s var(--ease);
        }
        .markdown-body a:hover::after {
            transform: scaleX(1);
        }
        /* 公告栏加载失败样式 */
        .error-message {
            color: #ffb4a2;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
        }

        /* ===== 右侧：博客区 ===== */
        .right-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 24px;
        }

        .profile-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            transition: all var(--duration) var(--ease);
        }

        .profile-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 50px rgba(255, 126, 179, 0.3);
            background: var(--glass-highlight);
        }

        .profile-card img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            margin-bottom: 18px;
            transition: transform var(--duration) var(--ease);
        }
        .profile-card:hover img {
            transform: rotate(12deg) scale(1.05);
        }

        .profile-card h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .profile-card p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .blog-list {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            max-height: 500px;
            overflow-y: auto;
            transition: all var(--duration) var(--ease);
        }

        .blog-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            position: relative;
            overflow: hidden;
        }

        .blog-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform var(--duration) var(--ease);
        }

        .blog-item:hover {
            transform: translateX(-8px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 20px rgba(255, 126, 179, 0.2);
        }

        .blog-item:hover::before {
            transform: scaleY(1);
        }

        .blog-item h3 {
            margin: 0 0 8px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .blog-item .date {
            font-size: 0.9rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 加载占位动画 */
        .loading-placeholder {
            text-align: center;
            padding: 30px;
            opacity: 0.8;
        }
        .loading-placeholder i {
            font-size: 2rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== 底部导航栏 (完全保留结构，增强动画) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 12px 30px;
            display: flex;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 100;
            transition: all var(--duration) var(--ease);
        }
        .bottom-nav.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .bottom-nav:not(.visible) {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        .nav-item {
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            position: relative;
            padding: 6px;
        }

        .nav-item:hover {
            color: var(--accent);
            transform: translateY(-4px) scale(1.15);
            text-shadow: 0 0 12px rgba(255, 126, 179, 0.6);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%;
            height: 2px;
            background: var(--accent);
            transition: transform var(--duration) var(--ease);
        }

        .nav-item:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* ===== 归档弹窗 ===== */
        .archive-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration) var(--ease);
        }

        .archive-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .archive-content {
            background: #1a1a2e;
            width: 100%;
            max-width: 520px;
            border-radius: 24px 24px 0 0;
            padding: 32px;
            transform: translateY(100%);
            transition: transform var(--duration) var(--ease);
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .archive-modal.active .archive-content {
            transform: translateY(0);
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .archive-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .archive-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
        }

        .archive-close:hover {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .archive-item {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .archive-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 20px;
        }

        .archive-item i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* ===== 文章阅读模态框 ===== */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration) var(--ease);
        }

        .article-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .article-modal-content {
            background: #1a1a2e;
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow-y: auto;
            max-height: 85vh;
            transform: scale(0.9);
            transition: transform var(--duration) var(--ease);
        }

        .article-modal.active .article-modal-content {
            transform: scale(1);
        }

        .article-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            z-index: 10;
        }

        .article-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .article-modal h1 {
            margin-bottom: 24px;
            font-size: 2rem;
            text-align: center;
            color: var(--text-primary);
            position: relative;
        }

        .article-modal h1::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* 响应式 */
        @media (max-width: 780px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                margin-top: 100px;
                gap: 20px;
            }
            .left-panel, .right-panel {
                max-width: 100%;
                width: 100%;
            }
            .right-panel {
                align-items: stretch;
            }
            .bottom-nav {
                gap: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

<div class="top-decor"></div>

<div class="main-container">
    <!-- 左侧公告栏 (保持原结构) -->
    <div class="left-panel animate-in" id="leftPanel">
        <h2><i class="fas fa-bullhorn"></i> 置顶公告</h2>
        <div id="top-content" class="markdown-body">加载中...</div>
    </div>

    <!-- 右侧区域 -->
    <div class="right-panel">
        <div class="profile-card animate-in">
            <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="avatar">
            <h1>LafiteLF's Blog</h1>
            <p>探索数字边界 · 记录生活点滴</p>
        </div>
        <div class="blog-list animate-in" id="blogListContainer">
            <div id="blog-list" class="loading-placeholder"><i class="fas fa-spinner"></i> 加载文章列表...</div>
        </div>
    </div>
</div>

<!-- 底部导航栏 -->
<div class="bottom-nav" id="bottomNav">
    <div class="nav-item" onclick="reloadPage()" title="刷新"><i class="fas fa-sync-alt"></i></div>
    <div class="nav-item" onclick="openArchive()" title="归档"><i class="fas fa-archive"></i></div>
    <div class="nav-item" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部"><i class="fas fa-arrow-up"></i></div>
</div>

<!-- 归档模态框 -->
<div id="archive-modal" class="archive-modal">
    <div class="archive-content">
        <div class="archive-header">
            <span class="archive-title"><i class="fas fa-archive"></i> 文章归档</span>
            <button class="archive-close" onclick="closeArchive()"><i class="fas fa-times"></i></button>
        </div>
        <div id="archive-list">加载中...</div>
    </div>
</div>

<!-- 文章阅读模态框 -->
<div id="article-modal" class="article-modal" style="pointer-events: none;">
    <div class="article-modal-content">
        <button class="article-modal-close" onclick="closeArticleModal()"><i class="fas fa-times"></i></button>
        <h1 id="article-title">文章标题</h1>
        <div id="article-body" class="markdown-body">内容加载中...</div>
    </div>
</div>

<script>
    // ========== 配置 ==========
    const USER = 'LafiteLF';
    const REPO = 'LafiteLF.github.io';
    const BLOG_DIR = 'blog';
    const TOP_FILE = 'top.md';
    
    // 简单缓存 (sessionStorage) 降低重复请求
    const CACHE_PREFIX = 'blog_cache_';
    const CACHE_TTL = 10 * 60 * 1000; // 10分钟缓存
    
    // 封装 fetch 带超时和重试 (健壮性)
    async function fetchWithTimeout(url, timeout = 8000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (err) {
            clearTimeout(id);
            throw err;
        }
    }
    
    // 获取原始文本 (核心修复: 正确的模板字符串，错误重试)
    async function fetchRawText(path, retries = 1) {
        const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${path}`;
        try {
            const res = await fetchWithTimeout(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
        } catch (err) {
            console.error(`获取文件失败 [${path}]:`, err);
            if (retries > 0) {
                await new Promise(r => setTimeout(r, 600));
                return fetchRawText(path, retries - 1);
            }
            return null;
        }
    }
    
    // 利用缓存获取文件 (用于列表等)
    async function fetchWithCache(key, fetcher, ttl = CACHE_TTL) {
        const cacheKey = CACHE_PREFIX + key;
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
            try {
                const { data, timestamp } = JSON.parse(cached);
                if (Date.now() - timestamp < ttl) return data;
            } catch(e) { /* 忽略解析错误 */ }
        }
        const freshData = await fetcher();
        if (freshData) {
            sessionStorage.setItem(cacheKey, JSON.stringify({ data: freshData, timestamp: Date.now() }));
        }
        return freshData;
    }
    
    // 获取文章列表 (使用 index.json 或 github api)
    async function fetchBlogFiles() {
        // 尝试 index.json
        const indexText = await fetchRawText(`${BLOG_DIR}/index.json`);
        if (indexText) {
            try {
                const parsed = JSON.parse(indexText);
                if (Array.isArray(parsed) && parsed.length) return parsed;
            } catch(e) { console.warn('index.json解析失败', e); }
        }
        // 回退: GitHub API 获取目录内容
        const apiUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/${BLOG_DIR}`;
        try {
            const response = await fetchWithTimeout(apiUrl);
            if (!response.ok) throw new Error(`API ${response.status}`);
            const data = await response.json();
            if (Array.isArray(data)) {
                return data
                    .filter(f => f.name && f.name.endsWith('.md'))
                    .map(f => ({ name: f.name, path: f.path, sha: f.sha }));
            }
            return [];
        } catch (err) {
            console.error('获取目录失败:', err);
            return null;
        }
    }
    
    // 1. 加载置顶公告 (带错误处理和优雅降级)
    async function loadTopContent() {
        const topDiv = document.getElementById('top-content');
        const text = await fetchRawText(TOP_FILE, 1);
        if (text && text.trim()) {
            try {
                topDiv.innerHTML = marked.parse(text);
            } catch(e) {
                topDiv.innerHTML = `<div class="error-message">Markdown解析错误</div>`;
            }
        } else {
            topDiv.innerHTML = `<div class="error-message">⚠️ 置顶公告加载失败，请检查网络或确认 top.md 存在。</div>`;
        }
        // 动画触发
        document.getElementById('leftPanel')?.classList.add('visible');
    }
    
    // 格式化日期 (从文件名提取 YYYY-MM-DD)
    function extractDate(filename) {
        const match = filename.match(/^(\d{4}-\d{2}-\d{2})/);
        return match ? match[1] : '未知日期';
    }
    
    // 2. 加载文章列表 (增强性能和错误)
    async function loadBlogList() {
        const listContainer = document.getElementById('blog-list');
        // 显示骨架
        listContainer.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner"></i> 加载文章列表...</div>`;
        
        const files = await fetchWithCache('blog_list', fetchBlogFiles, CACHE_TTL);
        if (!files || files.length === 0) {
            listContainer.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> 未找到任何文章，请确保 blog 目录下有 .md 文件或 index.json。</div>`;
            document.querySelector('.blog-list')?.classList.add('visible');
            return;
        }
        
        // 排序: 按文件名倒序 (新文章在前)
        const sorted = [...files].sort((a, b) => b.name.localeCompare(a.name));
        listContainer.innerHTML = '';
        sorted.forEach(file => {
            const item = document.createElement('div');
            item.className = 'blog-item';
            const title = file.name.replace(/\.md$/i, '');
            const dateStr = extractDate(file.name);
            item.innerHTML = `
                <h3><i class="fas fa-file-alt" style="margin-right: 8px; color: var(--accent);"></i>${escapeHtml(title)}</h3>
                <div class="date"><i class="far fa-calendar-alt"></i> ${escapeHtml(dateStr)}</div>
            `;
            item.onclick = () => openArticleModal(file.path, title);
            listContainer.appendChild(item);
        });
        
        document.querySelector('.blog-list')?.classList.add('visible');
    }
    
    // 简单的防XSS辅助
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // 3. 打开文章模态框 (添加加载指示器)
    async function openArticleModal(path, title) {
        const modal = document.getElementById('article-modal');
        const titleEl = document.getElementById('article-title');
        const bodyEl = document.getElementById('article-body');
        
        titleEl.textContent = title || '文章';
        bodyEl.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner"></i> 正在加载文章...</div>`;
        modal.classList.add('active');
        modal.style.pointerEvents = 'auto';
        
        const text = await fetchRawText(path, 1);
        if (text && text.trim()) {
            try {
                bodyEl.innerHTML = marked.parse(text);
                // 为所有链接添加外部网站特性
                bodyEl.querySelectorAll('a').forEach(a => a.setAttribute('target', '_blank'));
            } catch(e) {
                bodyEl.innerHTML = `<div class="error-message">文章解析失败。</div>`;
            }
        } else {
            bodyEl.innerHTML = `<div class="error-message">❌ 文章内容加载失败，路径: ${escapeHtml(path)}</div>`;
        }
    }
    
    // 4. 关闭文章模态框
    function closeArticleModal() {
        const modal = document.getElementById('article-modal');
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.pointerEvents = 'none';
        }, 400);
    }
    
    // 5. 打开归档弹窗 (复用现有逻辑 + 缓存)
    async function openArchive() {
        const modal = document.getElementById('archive-modal');
        const listEl = document.getElementById('archive-list');
        listEl.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner"></i> 加载归档...</div>`;
        modal.classList.add('active');
        
        const files = await fetchWithCache('blog_list', fetchBlogFiles, CACHE_TTL);
        if (!files || files.length === 0) {
            listEl.innerHTML = `<div class="error-message">暂无文章归档</div>`;
            return;
        }
        const sorted = [...files].sort((a, b) => b.name.localeCompare(a.name));
        listEl.innerHTML = '';
        sorted.forEach(file => {
            const div = document.createElement('div');
            div.className = 'archive-item';
            const title = file.name.replace(/\.md$/i, '');
            const datePart = extractDate(file.name);
            div.innerHTML = `<i class="fas fa-file-alt"></i> <span><strong>${escapeHtml(title)}</strong><br><small style="opacity:0.7;">${escapeHtml(datePart)}</small></span>`;
            div.onclick = () => {
                closeArchive();
                openArticleModal(file.path, title);
            };
            listEl.appendChild(div);
        });
    }
    
    function closeArchive() {
        document.getElementById('archive-modal')?.classList.remove('active');
    }
    
    // 刷新页面方法
    function reloadPage() {
        // 清除关键缓存让数据重新获取（可选）
        sessionStorage.removeItem(CACHE_PREFIX + 'blog_list');
        location.reload();
    }
    
    // 页面加载: 处理所有动画和请求
    window.addEventListener('DOMContentLoaded', () => {
        // 为所有 animate-in 元素添加渐现
        setTimeout(() => {
            document.querySelectorAll('.animate-in').forEach(el => el.classList.add('visible'));
            const bottomNav = document.getElementById('bottomNav');
            if (bottomNav) bottomNav.classList.add('visible');
        }, 100);
        
        // 加载数据
        loadTopContent();
        loadBlogList();
        
        // 点击模态框背景关闭 (体验增强)
        const articleModal = document.getElementById('article-modal');
        articleModal.addEventListener('click', (e) => {
            if (e.target === articleModal) closeArticleModal();
        });
        const archiveModal = document.getElementById('archive-modal');
        archiveModal.addEventListener('click', (e) => {
            if (e.target === archiveModal) closeArchive();
        });
        
        // 预加载 marked 库检测，若未加载则回退模拟
        if (typeof marked === 'undefined') {
            console.warn('marked库未加载，Markdown将显示原始文本');
            window.marked = { parse: (t) => `<pre>${escapeHtml(t)}</pre>` };
        }
    });
    
    // 暴露全局函数供内联调用
    window.reloadPage = reloadPage;
    window.openArchive = openArchive;
    window.closeArchive = closeArchive;
    window.closeArticleModal = closeArticleModal;
    window.openArticleModal = openArticleModal;
</script>
</body>
</html>
