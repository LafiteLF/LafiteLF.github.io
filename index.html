<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Liquid Glass · LafiteLF 动态博客</title>
    <!-- marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome 6 免费图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 革命性 Liquid Glass 设计语言 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "SF Pro Text", "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0f2a, #04081a);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        /* 动态流动光晕背景 (Liquid Glass 核心) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 60%, rgba(255, 126, 179, 0.25), rgba(37, 117, 252, 0.2) 70%, transparent);
            pointer-events: none;
            z-index: 0;
            animation: liquidShift 18s infinite alternate ease-in-out;
        }

        @keyframes liquidShift {
            0% { opacity: 0.4; transform: scale(1) translate(0%, 0%); filter: blur(60px);}
            100% { opacity: 0.9; transform: scale(1.2) translate(4%, 6%); filter: blur(80px);}
        }

        /* 玻璃拟态增强 + 弹性动画 */
        :root {
            --glass-bg: rgba(20, 28, 48, 0.38);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --accent: #ff7eb3;
            --accent-glow: #ff3b8e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --blur-strong: blur(20px);
            --blur-soft: blur(12px);
            --ease-spring: cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --ease-liquid: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --duration-fast: 0.28s;
            --duration-bounce: 0.55s;
        }

        /* 自适应容器 */
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 1300px;
            margin-top: 110px;
            gap: 32px;
            flex: 1;
            z-index: 2;
            position: relative;
        }

        /* ========== 左侧公告栏 Liquid Glass ========== */
        .left-panel {
            flex: 1;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: var(--blur-strong);
            -webkit-backdrop-filter: var(--blur-strong);
            border: 1px solid var(--glass-border);
            border-radius: 48px;
            padding: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow-y: auto;
            position: relative;
            transition: transform 0.35s var(--ease-spring), box-shadow 0.4s ease;
        }

        .left-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 32px 55px -12px rgba(255, 126, 179, 0.3);
            border-color: rgba(255, 126, 179, 0.4);
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 48px;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08), transparent);
            pointer-events: none;
        }

        .left-panel h2 {
            font-size: 1.7rem;
            font-weight: 590;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff, rgba(255,255,245,0.8));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            border-bottom: 1.5px solid rgba(255,126,179,0.5);
            padding-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 高级 Markdown 排版 */
        .markdown-body {
            font-size: 1rem;
            line-height: 1.65;
            color: var(--text-secondary);
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: white;
            font-weight: 590;
            letter-spacing: -0.2px;
        }
        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }
        .markdown-body a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), #ffb86b);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s var(--ease-spring);
        }
        .markdown-body a:hover::after {
            transform: scaleX(1);
        }

        /* ===== 右侧区域 流体玻璃 ===== */
        .right-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* 个人卡片 liquid 悬浮 */
        .profile-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: var(--blur-strong);
            border: 1px solid var(--glass-border);
            border-radius: 44px;
            padding: 32px 24px;
            text-align: center;
            transition: all 0.4s var(--ease-spring);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
        }

        .profile-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(30, 38, 58, 0.55);
            border-color: rgba(255,126,179,0.6);
            box-shadow: 0 30px 55px -12px rgba(255, 126, 179, 0.4);
        }

        .profile-card img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.5s var(--ease-spring);
        }
        .profile-card:hover img {
            transform: scale(1.05) rotate(3deg);
        }

        .profile-card h1 {
            margin: 18px 0 6px;
            font-size: 2rem;
            font-weight: 640;
            background: linear-gradient(125deg, #FFF, #ffc3e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* 博客列表 灵动玻璃 */
        .blog-list {
            background: var(--glass-bg);
            backdrop-filter: var(--blur-strong);
            border: 1px solid var(--glass-border);
            border-radius: 44px;
            padding: 28px;
            max-height: 500px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .blog-item {
            background: rgba(255,255,255,0.03);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all 0.35s var(--ease-spring);
            position: relative;
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
        }

        .blog-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(8px) scale(1.01);
            border-color: rgba(255,126,179,0.5);
            box-shadow: 0 12px 25px -8px rgba(0,0,0,0.3);
        }

        .blog-item h3 {
            font-size: 1.35rem;
            font-weight: 610;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .blog-item .date {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 8px;
            letter-spacing: -0.2px;
        }

        /* Loading 流体效果 */
        .loading-placeholder {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 48px;
            backdrop-filter: blur(5px);
        }
        .loading-placeholder i {
            font-size: 2rem;
            animation: liquidSpin 1.2s infinite ease;
        }
        @keyframes liquidSpin {
            0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; color: var(--accent);}
            100% { transform: rotate(360deg) scale(1); opacity: 0.6;}
        }

        /* ===== 底部导航栏：液态玻璃 + 弹性= ===== */
        .bottom-nav {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(18, 25, 45, 0.6);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 80px;
            padding: 10px 32px;
            display: flex;
            gap: 38px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 200;
            transition: all 0.4s var(--ease-spring);
            opacity: 0;
        }
        .bottom-nav.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .bottom-nav:hover {
            gap: 42px;
            background: rgba(25, 35, 58, 0.7);
        }

        .nav-item {
            color: rgba(255,255,245,0.85);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.25s var(--ease-spring);
            position: relative;
            padding: 8px;
        }
        .nav-item:hover {
            color: var(--accent);
            transform: translateY(-5px) scale(1.18);
            text-shadow: 0 0 12px #ff7eb3;
        }

        /* 通用液态模态框 */
        .modal-glass {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 28, 0.7);
            backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0s linear 0.4s;
        }
        .modal-glass.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease;
        }
        .modal-card-liquid {
            background: rgba(18, 24, 42, 0.85);
            backdrop-filter: blur(35px);
            width: 100%;
            max-width: 580px;
            border-radius: 48px 48px 32px 32px;
            padding: 28px 28px 36px;
            transform: translateY(100%);
            transition: transform 0.5s var(--ease-spring);
            border-top: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }
        .modal-glass.active .modal-card-liquid {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .modal-title {
            font-size: 1.8rem;
            font-weight: 620;
            background: linear-gradient(145deg, #fff, #ffb7d2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-close:hover {
            background: var(--accent);
            transform: rotate(90deg) scale(1.05);
        }

        /* 归档 + 下载列表项 */
        .archive-item, .download-item-glass {
            padding: 16px 20px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 34px;
            cursor: pointer;
            transition: all 0.25s var(--ease-spring);
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(5px);
        }
        .archive-item:hover, .download-item-glass:hover {
            background: rgba(255,126,179,0.2);
            transform: translateX(6px);
            border-left: 3px solid var(--accent);
        }
        .archive-item i, .download-item-glass i:first-child {
            font-size: 1.6rem;
            color: var(--accent);
        }

        /* 文章模态框 更高级 */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(32px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
        }
        .article-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .article-content {
            background: rgba(22, 28, 48, 0.85);
            backdrop-filter: blur(48px);
            width: 90%;
            max-width: 720px;
            border-radius: 56px;
            padding: 40px;
            transform: scale(0.92);
            transition: transform 0.45s var(--ease-spring);
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 35px 70px rgba(0,0,0,0.4);
        }
        .article-modal.active .article-content {
            transform: scale(1);
        }
        .article-modal h1 {
            font-size: 2rem;
            font-weight: 660;
            text-align: center;
            margin-bottom: 28px;
            background: linear-gradient(125deg, #fff, #ffbcd9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 12px;
        }

        @media (max-width: 780px) {
            .main-container { flex-direction: column; align-items: center; margin-top: 90px; gap: 24px; }
            .right-panel { width: 100%; align-items: stretch; }
            .bottom-nav { gap: 24px; padding: 8px 24px; }
        }

        .error-message {
            background: rgba(255,80,80,0.2);
            backdrop-filter: blur(12px);
            padding: 14px;
            border-radius: 32px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左侧公告 Liquid Glass -->
    <div class="left-panel animate-in" id="leftPanel">
        <h2><i class="fas fa-water" style="color: #ff7eb3;"></i> 置顶公告</h2>
        <div id="top-content" class="markdown-body">加载中...</div>
    </div>

    <!-- 右侧区域 -->
    <div class="right-panel">
        <div class="profile-card animate-in">
            <img src="https://avatars.githubusercontent.com/u/187166523?s=120&v=4" alt="Lafite">
            <h1>LafiteLF</h1>
            <p style="font-weight: 450;">数字边界 · 流体创意</p>
        </div>
        <div class="blog-list animate-in">
            <div id="blog-list" class="loading-placeholder"><i class="fas fa-droplet"></i> 加载文章流...</div>
        </div>
    </div>
</div>

<!-- 底部导航栏 + 新增下载 -->
<div class="bottom-nav" id="bottomNav">
    <div class="nav-item" onclick="reloadPageLiquid()" title="刷新"><i class="fas fa-sync-alt"></i></div>
    <div class="nav-item" onclick="openArchiveLiquid()" title="归档"><i class="fas fa-archive"></i></div>
    <div class="nav-item" onclick="openDownloadLiquid()" title="下载中心"><i class="fas fa-download"></i></div>
    <div class="nav-item" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="流体上升"><i class="fas fa-arrow-up"></i></div>
</div>

<!-- 归档模态框 liquid -->
<div id="archiveModal" class="modal-glass">
    <div class="modal-card-liquid">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-archive"></i> 时光档案馆</span>
            <button class="modal-close" onclick="closeArchiveLiquid()"><i class="fas fa-xmark"></i></button>
        </div>
        <div id="archiveListLiquid">加载中...</div>
    </div>
</div>

<!-- 下载模态框 流体玻璃 -->
<div id="downloadModal" class="modal-glass">
    <div class="modal-card-liquid">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-cloud-arrow-down"></i> 液态资源库</span>
            <button class="modal-close" onclick="closeDownloadLiquid()"><i class="fas fa-xmark"></i></button>
        </div>
        <div id="downloadListLiquid">加载中...</div>
    </div>
</div>

<!-- 文章阅读模态框 -->
<div id="articleModal" class="article-modal" style="pointer-events: none;">
    <div class="article-content">
        <button class="modal-close" style="position: absolute; top: 24px; right: 28px;" onclick="closeArticleLiquid()"><i class="fas fa-times"></i></button>
        <h1 id="articleTitleLiquid">文章标题</h1>
        <div id="articleBodyLiquid" class="markdown-body">加载内容中 ...</div>
    </div>
</div>

<script>
    // ========== 配置 ==========
    const USER = 'LafiteLF';
    const REPO = 'LafiteLF.github.io';
    const BLOG_DIR = 'blog';
    const TOP_FILE = 'top.md';
    const DOWNLOAD_DIR = 'download';
    const CACHE_TTL = 10 * 60 * 1000;
    const CACHE_PREFIX = 'lg_';

    // 工具函数：fetch 容错 + 超时
    async function fetchWithTimeout(url, timeout = 7500) {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), timeout);
        try {
            const res = await fetch(url, { signal: ctrl.signal });
            clearTimeout(id);
            return res;
        } catch(e) {
            clearTimeout(id);
            throw e;
        }
    }

    async function fetchRawText(path, retries = 1) {
        const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${path}`;
        try {
            const resp = await fetchWithTimeout(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.text();
        } catch(err) {
            if (retries > 0) { await new Promise(r => setTimeout(r, 500)); return fetchRawText(path, retries -1); }
            return null;
        }
    }

    async function fetchWithCache(key, fetcher) {
        const cached = sessionStorage.getItem(CACHE_PREFIX+key);
        if(cached) {
            try { const {data, ts} = JSON.parse(cached); if(Date.now() - ts < CACHE_TTL) return data; } catch(e) {}
        }
        const fresh = await fetcher();
        if(fresh) sessionStorage.setItem(CACHE_PREFIX+key, JSON.stringify({data: fresh, ts: Date.now()}));
        return fresh;
    }

    async function fetchDirectory(dir) {
        const api = `https://api.github.com/repos/${USER}/${REPO}/contents/${dir}`;
        try {
            const res = await fetchWithTimeout(api);
            if(!res.ok) return null;
            const data = await res.json();
            return Array.isArray(data) ? data.filter(f => f.type === 'file') : null;
        } catch(e) { return null; }
    }

    async function getBlogFiles() {
        const idx = await fetchRawText(`${BLOG_DIR}/index.json`);
        if(idx) {
            try { const parsed = JSON.parse(idx); if(parsed.length) return parsed; } catch(e) {}
        }
        const files = await fetchDirectory(BLOG_DIR);
        return files ? files.map(f => ({ name: f.name, path: f.path })) : [];
    }

    // 加载公告
    async function loadTopLiquid() {
        const container = document.getElementById('top-content');
        const md = await fetchRawText(TOP_FILE);
        if(md) {
            try { container.innerHTML = marked.parse(md); } catch(e) { container.innerHTML = '<div class="error-message">解析错误</div>'; }
        } else { container.innerHTML = '<div class="error-message">✨ 公告加载中，或暂无 top.md</div>'; }
        document.getElementById('leftPanel')?.classList.add('visible');
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }
    function extractDate(name) { const m = name.match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : '深邃时光'; }

    async function loadBlogLiquid() {
        const listDiv = document.getElementById('blog-list');
        listDiv.innerHTML = `<div class="loading-placeholder"><i class="fas fa-droplet"></i> 涌动文章流...</div>`;
        const posts = await fetchWithCache('blog_posts', getBlogFiles);
        if(!posts.length) { listDiv.innerHTML = '<div class="error-message">🌊 未找到文章，请添加blog目录</div>'; return; }
        const sorted = [...posts].sort((a,b)=> b.name.localeCompare(a.name));
        listDiv.innerHTML = '';
        sorted.forEach(p => {
            const title = p.name.replace(/\.md$/i,'');
            const item = document.createElement('div');
            item.className = 'blog-item';
            item.innerHTML = `<h3><i class="fas fa-feather-alt"></i> ${escapeHtml(title)}</h3><div class="date"><i class="far fa-calendar"></i> ${escapeHtml(extractDate(p.name))}</div>`;
            item.onclick = () => openArticleLiquid(p.path, title);
            listDiv.appendChild(item);
        });
    }

    // 打开文章
    async function openArticleLiquid(path, title) {
        const modal = document.getElementById('articleModal');
        document.getElementById('articleTitleLiquid').innerText = title || '流光文章';
        const bodyDiv = document.getElementById('articleBodyLiquid');
        bodyDiv.innerHTML = `<div class="loading-placeholder"><i class="fas fa-water"></i> 流淌的文字...</div>`;
        modal.style.pointerEvents = 'auto';
        modal.classList.add('active');
        const content = await fetchRawText(path);
        if(content) {
            try { bodyDiv.innerHTML = marked.parse(content); bodyDiv.querySelectorAll('a').forEach(a=>a.target='_blank'); } catch(e){ bodyDiv.innerHTML = '<div class="error-message">解析失败</div>'; }
        } else { bodyDiv.innerHTML = '<div class="error-message">❌ 无法加载文章内容</div>'; }
    }
    function closeArticleLiquid() {
        const modal = document.getElementById('articleModal');
        modal.classList.remove('active');
        setTimeout(() => { modal.style.pointerEvents = 'none'; }, 400);
    }

    // 归档
    async function openArchiveLiquid() {
        const modal = document.getElementById('archiveModal');
        const listEl = document.getElementById('archiveListLiquid');
        listEl.innerHTML = `<div class="loading-placeholder"><i class="fas fa-droplet"></i> 唤醒档案...</div>`;
        modal.classList.add('active');
        const posts = await fetchWithCache('blog_posts', getBlogFiles);
        if(!posts.length) { listEl.innerHTML = '<div class="error-message">无归档文章</div>'; return; }
        const sorted = [...posts].sort((a,b)=>b.name.localeCompare(a.name));
        listEl.innerHTML = '';
        sorted.forEach(p => {
            const title = p.name.replace(/\.md$/i,'');
            const div = document.createElement('div');
            div.className = 'archive-item';
            div.innerHTML = `<i class="fas fa-journal-whills"></i> <strong>${escapeHtml(title)}</strong><br><small>${escapeHtml(extractDate(p.name))}</small>`;
            div.onclick = () => { closeArchiveLiquid(); openArticleLiquid(p.path, title); };
            listEl.appendChild(div);
        });
    }
    function closeArchiveLiquid() { document.getElementById('archiveModal')?.classList.remove('active'); }

    // ========== 下载功能 华丽 ==========
    async function getDownloadFiles() {
        return await fetchDirectory(DOWNLOAD_DIR);
    }
    function getLiquidIcon(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if(['png','jpg','jpeg','gif','webp'].includes(ext)) return 'fas fa-image';
        if(['zip','rar','7z'].includes(ext)) return 'fas fa-file-zipper';
        if(['pdf'].includes(ext)) return 'fas fa-file-pdf';
        if(['mp3','wav'].includes(ext)) return 'fas fa-head-side-headphones';
        return 'fas fa-file-circle-info';
    }
    async function openDownloadLiquid() {
        const modal = document.getElementById('downloadModal');
        const container = document.getElementById('downloadListLiquid');
        container.innerHTML = `<div class="loading-placeholder"><i class="fas fa-fan"></i> 液态资源扫描中...</div>`;
        modal.classList.add('active');
        const files = await fetchWithCache('download_files', getDownloadFiles);
        if(!files || files.length === 0) {
            container.innerHTML = `<div class="error-message"><i class="fas fa-folder-open"></i> 未发现 /${DOWNLOAD_DIR} 中的资源，等待创意注入。</div>`;
            return;
        }
        container.innerHTML = '';
        files.forEach(file => {
            const dlUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${file.path}`;
            const sizeKb = file.size ? (file.size/1024).toFixed(1) + ' KB' : '';
            const item = document.createElement('div');
            item.className = 'download-item-glass';
            item.innerHTML = `
                <i class="${getLiquidIcon(file)}"></i>
                <div style="flex:1"><div style="font-weight: 520;">${escapeHtml(file.name)}</div><div style="font-size: 0.7rem; opacity:0.7;">${sizeKb}</div></div>
                <i class="fas fa-cloud-arrow-down" style="font-size: 1.3rem; opacity:0.6;"></i>
            `;
            item.onclick = (e) => {
                e.stopPropagation();
                const a = document.createElement('a');
                a.href = dlUrl;
                a.download = file.name;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            container.appendChild(item);
        });
    }
    function closeDownloadLiquid() { document.getElementById('downloadModal')?.classList.remove('active'); }
    function reloadPageLiquid() {
        sessionStorage.removeItem(CACHE_PREFIX+'blog_posts');
        sessionStorage.removeItem(CACHE_PREFIX+'download_files');
        location.reload();
    }

    // 初始化 + 灵动动画
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            document.querySelectorAll('.animate-in').forEach(el => el.classList.add('visible'));
            document.getElementById('bottomNav')?.classList.add('visible');
        }, 80);
        loadTopLiquid();
        loadBlogLiquid();
        // 背景液态光影跟随鼠标 (超流体细节)
        document.body.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth) * 20;
            const moveY = (e.clientY / window.innerHeight) * 20;
            document.body.style.setProperty('background-position', `${moveX}% ${moveY}%`);
        });
        const articleMod = document.getElementById('articleModal');
        articleMod.addEventListener('click', (e) => { if(e.target === articleMod) closeArticleLiquid(); });
        const archMod = document.getElementById('archiveModal');
        archMod.addEventListener('click', (e) => { if(e.target === archMod) closeArchiveLiquid(); });
        const downMod = document.getElementById('downloadModal');
        downMod.addEventListener('click', (e) => { if(e.target === downMod) closeDownloadLiquid(); });
        if(typeof marked === 'undefined') window.marked = { parse: t => `<pre>${escapeHtml(t)}</pre>` };
    });

    window.reloadPageLiquid = reloadPageLiquid;
    window.openArchiveLiquid = openArchiveLiquid;
    window.closeArchiveLiquid = closeArchiveLiquid;
    window.closeArticleLiquid = closeArticleLiquid;
    window.openArticleLiquid = openArticleLiquid;
    window.openDownloadLiquid = openDownloadLiquid;
    window.closeDownloadLiquid = closeDownloadLiquid;
</script>
</body>
</html>
