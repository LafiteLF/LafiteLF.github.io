<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 核心样式 (完全保留你的 UI 风格) --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --blur-strength: 12px;
            --corner-radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #8E2DE2, #4A00E0); /* 默认深紫渐变 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px 100px;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* 磨砂玻璃通用类 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border: 1px solid var(--glass-border);
            border-radius: var(--corner-radius);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 480px;
            padding: 25px;
            color: var(--text-primary);
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-panel:active {
            transform: scale(0.98);
        }

        /* --- 头部区域 --- */
        #header {
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        。subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* --- 文章列表区域 --- */
        #article-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .article-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }

        。article-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
            z-index: 2;
        }

        .article-meta {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
            z-index: 2;
        }

        /* --- 阅读界面 (隐藏/显示控制) --- */
        #reader-view {
            display: none; /* 默认隐藏 */
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s ease;
        }

        。reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        。back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        。back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .download-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            text-decoration: none; /* 去掉链接下划线 */
        }

        .download-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        #reader-content {
            line-height: 1.8;
            font-size: 1rem;
            text-align: left;
            overflow-y: auto;
            max-height: 70vh;
            padding-right: 5px;
        }

        /* Markdown 内容样式 */
        #reader-content h1, #reader-content h2, #reader-content h3 {
            margin: 20px 0 10px;
            color: var(--glass-highlight);
        }
        #reader-content p {
            margin-bottom: 15px;
        }
        #reader-content code {
            background: rgba(0,0,0,0.3);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }
        #reader-content pre {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        /* --- 底部导航栏 (完全保留) --- */
        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .dock {
            display: flex;
            gap: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .dock-item {
            color: rgba(255,255,255,0.7);
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .dock-item:hover {
            color: #fff;
            transform: scale(1.2) translateY(-5px);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .dock-item.active {
            color: #fff;
            transform: scale(1.1);
        }

        /* --- 新增：归档弹窗样式 (MacOS 风格) --- */
        .archive-modal {
            position: fixed;
            bottom: 100px; /* 在 Dock 栏上方 */
            left: 50%;
            transform: translateX(-50%) translateY(100%); /* 初始位置在屏幕外下方 */
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            z-index: 200;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* 丝滑弹起曲线 */
            max-height: 60vh;
            overflow-y: auto;
        }

        。archive-modal。show {
            transform: translateX(-50%) translateY(0); /* 弹起到原位 */
            opacity: 1;
            visibility: visible;
        }

        .archive-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            color: #fff;
        }

        .archive-list {
            list-style: none;
        }

        .archive-item {
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s, padding-left 0.2s;
        }

        .archive-item:hover {
            color: #fff;
            padding-left: 10px;
        }

        /* --- 动画定义 --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <!-- 1. 首页视图 -->
    <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <!-- 头部 (不动) -->
        <header class="glass-panel" id="header">
            <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar" class="avatar">
            <h1>LafiteLF's Blog</h1>
            <p class="subtitle">探索数字边界 · 记录生活点滴</p>
        </header>

        <!-- 文章列表容器 (不动结构，修复逻辑) -->
        <main class="glass-panel" style="min-height: 200px;">
            <div id="article-list">
                <!-- JS 动态插入文章卡片 -->
                <div style="text-align:center; padding: 20px; color: rgba(255,255,255,0.6);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:10px; font-size: 0.9rem;">正在连接 GitHub...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 2. 阅读视图 (默认隐藏) -->
    <div id="reader-view">
        <div class="glass-panel" style="padding: 20px;">
            <div class="reader-header">
                <button class="back-btn" onclick="closeReader()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h3 id="reader-title" style="margin: 0; font-size: 1.1rem; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">文章标题</h3>
                <!-- 下载按钮 -->
                <a id="download-link" href="#" class="download-btn" download>
                    <i class="fas fa-download"></i>
                </a>
            </div>
            <div id="reader-content" class="glass-panel" style="background: transparent; border: none; padding: 0; box-shadow: none; max-height: 60vh; overflow-y: auto;">
                <!-- Markdown 内容渲染在这里 -->
            </div>
        </div>
    </div>

    <!-- 3. 归档弹窗 (新增) -->
    <div id="archive-modal" class="archive-modal">
        <div class="archive-title"><i class="fas fa-box-open"></i> 文章归档</div>
        <ul id="archive-list-content" class="archive-list">
            <!-- JS 填充归档列表 -->
        </ul>
    </div>

    <!-- 4. 底部导航 (完全保留) -->
    <nav class="dock-container">
        <div class="dock">
            <div class="dock-item active" onclick="showHome()" title="首页">
                <i class="fas fa-home"></i>
            </div>
            <div class="dock-item" onclick="toggleArchive()" title="归档">
                <i class="fas fa-archive"></i>
            </div>
            <div class="dock-item" onclick="alert('功能开发中...')" title="关于">
                <i class="fas fa-user"></i>
            </div>
            <div class="dock-item" onclick="window.open('https://github.com/LafiteLF', '_blank')" title="GitHub">
                <i class="fab fa-github"></i>
            </div>
        </div>
    </nav>

    <script>
        // --- 配置区域 ---
        // ⚠️ 注意：这里的路径必须对应你仓库里的实际文件夹
        const GITHUB_USER = 'LafiteLF';
        const GITHUB_REPO = 'LafiteLF.github.io'; // 你的仓库名
        const BLOG_PATH = 'blog'; // 你的 md 文件存放的文件夹
        const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BLOG_PATH}`;

        // 全局变量存储文章数据
        let articlesData = [];

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchArticles();
        });

        // --- 1. 获取文章列表 ---
        async function fetchArticles() {
            const listContainer = document.getElementById('article-list');

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`GitHub API Error: ${response.status}`);
                }

                const data = await response.json();

                // 过滤只保留 .md 文件
                articlesData = data.filter(item => item.name.endsWith('.md'));

                if (articlesData.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center;">暂无文章，快去 blog 文件夹写点东西吧！</p>';
                    updateArchiveList(); // 同步更新归档
                    return;
                }

                // 渲染列表
                listContainer.innerHTML = '';
                articlesData.forEach(item => {
                    // 去掉 .md 后缀作为标题显示
                    const title = item.name.replace('.md', '');

                    const card = document.createElement('div');
                    card.className = 'article-card';
                    // 添加点击动画类
                    card.onclick = () => openReader(item);

                    card.innerHTML = `
                        <div class="article-title">${title}</div>
                        <div class="article-meta"><i class="far fa-file-alt"></i> ${item.name}</div>
                    `;
                    listContainer.appendChild(card);
                });

                // 同步更新归档列表
                updateArchiveList();

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `
                    <div style="text-align:center; color: #ff6b6b;">
                        <i class="fas fa-exclamation-triangle fa-2x"></i>
                        <p style="margin-top:10px;">加载失败</p>
                        <p style="font-size:0.8rem; opacity:0.7;">${error.message}</p>
                    </div>
                `;
            }
        }

        // --- 2. 打开阅读器 ---
        async function openReader(item) {
            // 简单的加载状态
            const readerView = document.getElementById('reader-view');
            const readerContent = document.getElementById('reader-content');
            const readerTitle = document.getElementById('reader-title');
            const downloadLink = document.getElementById('download-link');

            readerView.style.display = 'flex';
            readerContent.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';

            // 设置标题和下载链接
            // 注意：raw.githubusercontent.com 的路径结构是 /user/repo/branch/folder/file
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${BLOG_PATH}/${item.name}`;
            downloadLink.href = rawUrl; // 设置下载链接
            readerTitle.innerText = item.name.replace('.md', '');

            try {
                const response = await fetch(rawUrl);
                const text = await response.text();
                readerContent.innerHTML = marked.parse(text);
            } catch (e) {
                readerContent.innerHTML = '<p>内容加载失败</p>';
            }

            // 隐藏首页
            document.getElementById('home-view').style.display = 'none';
            // 隐藏归档弹窗（如果开着的话）
            document.getElementById('archive-modal').classList.remove('show');
        }

        // --- 3. 关闭阅读器 ---
        function closeReader() {
            const readerView = document.getElementById('reader-view');
            readerView.style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
        }

        // --- 4. 归档功能 (带动画) ---
        function toggleArchive() {
            const modal = document.getElementById('archive-modal');
            const isActive = modal.classList.contains('show');

            if (isActive) {
                modal.classList.remove('show');
            } else {
                // 只有在有数据时才打开，或者先加载
                if (articlesData.length > 0) {
                    modal.classList.add('show');
                } else {
                    // 如果数据还没加载完，提示一下
                    alert('文章列表加载中...');
                }
            }
        }

        // 更新归档列表内容
        function updateArchiveList() {
            const list = document.getElementById('archive-list-content');
            list.innerHTML = '';
            articlesData.forEach(item => {
                const li = document.createElement('li');
                li.className = 'archive-item';
                li.innerText = item.name.replace('.md', '');
                li.onclick = () => {
                    // 点击归档项也打开阅读器
                    toggleArchive(); // 先关弹窗
                    setTimeout(() => openReader(item), 300); // 等动画结束再开
                };
                list.appendChild(li);
            });
        }

        // --- 5. 返回首页 ---
        function showHome() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
            document.getElementById('archive-modal').classList.remove('show');
        }

    </script>
</body>
</html>
