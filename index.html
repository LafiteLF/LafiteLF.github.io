<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --accent: #ff7eb3;
            --blur: 16px;
            --duration: 0.4s;
            --ease: cubic-bezier(0.17, 0.67, 0.88, 1.01);
        }

        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 动画库 ===== */
        .animate-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity var(--duration) var(--ease), transform var(--duration) var(--ease);
        }
        .animate-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .animate-fade {
            opacity: 0;
            transition: opacity var(--duration) var(--ease);
        }
        .animate-fade.visible {
            opacity: 1;
        }

        .animate-slide-up {
            transform: translateY(100%);
            transition: transform var(--duration) var(--ease);
        }
        .animate-slide-up.visible {
            transform: translateY(0);
        }

        .animate-pulse {
            animation: pulse var(--duration) infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        /* ===== 顶部装饰头像 ===== */
        .top-decor {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: url('https://avatars.githubusercontent.com/u/187166523?s=96&v=4') no-repeat center/cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            z-index: 10;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        /* ===== 主布局 ===== */
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            margin-top: 120px;
            gap: 24px;
            flex: 1;
        }

        /* ===== 左侧：置顶公告面板 ===== */
        .left-panel {
            flex: 1;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            overflow-y: auto;
            position: relative;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
        }

        .left-panel h2 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-primary);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--text-primary);
            margin-top: 1.5em;
        }
        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            position: relative;
        }
        .markdown-body a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s var(--ease);
        }
        .markdown-body a:hover::after {
            transform: scaleX(1);
        }

        /* ===== 右侧：博客区 ===== */
        .right-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .profile-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            transition: all var(--duration) var(--ease);
        }

        .profile-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 50px rgba(255, 126, 179, 0.3);
            background: var(--glass-highlight);
        }

        .profile-card img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            margin-bottom: 18px;
            transition: transform var(--duration) var(--ease);
        }
        .profile-card:hover img {
            transform: rotate(12deg) scale(1.05);
        }

        .profile-card h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .profile-card p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .blog-list {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            max-height: 500px;
            overflow-y: auto;
            transition: all var(--duration) var(--ease);
        }

        .blog-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            position: relative;
            overflow: hidden;
        }

        .blog-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform var(--duration) var(--ease);
        }

        .blog-item:hover {
            transform: translateX(-8px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 20px rgba(255, 126, 179, 0.2);
        }

        .blog-item:hover::before {
            transform: scaleY(1);
        }

        .blog-item h3 {
            margin: 0 0 8px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .blog-item .date {
            font-size: 0.9rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 底部导航栏 (完全保留结构，增强动画) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 12px 30px;
            display: flex;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 100;
            transition: all var(--duration) var(--ease);
        }

        .nav-item {
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            position: relative;
            padding: 6px;
        }

        .nav-item:hover {
            color: var(--accent);
            transform: translateY(-4px) scale(1.15);
            text-shadow: 0 0 12px rgba(255, 126, 179, 0.6);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%;
            height: 2px;
            background: var(--accent);
            transition: transform var(--duration) var(--ease);
        }

        .nav-item:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* ===== 归档弹窗 ===== */
        .archive-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration) var(--ease);
        }

        .archive-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .archive-content {
            background: #1a1a2e;
            width: 100%;
            max-width: 520px;
            border-radius: 24px 24px 0 0;
            padding: 32px;
            transform: translateY(100%);
            transition: transform var(--duration) var(--ease);
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .archive-modal.active .archive-content {
            transform: translateY(0);
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .archive-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .archive-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
        }

        .archive-close:hover {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .archive-item {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .archive-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 20px;
        }

        .archive-item i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* ===== 文章阅读模态框 ===== */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration) var(--ease);
        }

        .article-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .article-modal-content {
            background: #1a1a2e;
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform var(--duration) var(--ease);
        }

        .article-modal.active .article-modal-content {
            transform: scale(1);
        }

        .article-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
        }

        .article-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .article-modal h1 {
            margin-bottom: 24px;
            font-size: 2rem;
            text-align: center;
            color: var(--text-primary);
            position: relative;
        }

        .article-modal h1::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- 顶部装饰 -->
    <div class="top-decor"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧：置顶公告 -->
        <div class="left-panel animate-in">
            <h2><i class="fas fa-thumbtack"></i> 置顶公告</h2>
            <div id="top-content" class="markdown-body">加载中...</div>
        </div>

        <!-- 右侧：博客 -->
        <div class="right-panel">
            <div class="profile-card animate-in">
                <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar">
                <h1>LafiteLF's Blog</h1>
                <p>探索数字边界 · 记录生活点滴</p>
            </div>

            <div class="blog-list animate-in" id="blog-list">
                <!-- 文章列表将由 JS 插入 -->
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav animate-fade">
        <div class="nav-item" onclick="reloadPage()"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="openArchive()"><i class="fas fa-archive"></i></div>
        <div class="nav-item" onclick="alert('功能开发中')"><i class="fas fa-user"></i></div>
        <div class="nav-item" onclick="window.open('https://github.com/LafiteLF', '_blank')"><i class="fab fa-github"></i></div>
    </div>

    <!-- 归档弹窗 -->
    <div class="archive-modal" id="archive-modal">
        <div class="archive-content">
            <div class="archive-header">
                <h3 class="archive-title"><i class="fas fa-file-alt"></i> 文章归档</h3>
                <button class="archive-close" onclick="closeArchive()"><i class="fas fa-times"></i></button>
            </div>
            <div id="archive-list"></div>
        </div>
    </div>

    <!-- 文章阅读模态框 -->
    <div class="article-modal" id="article-modal">
        <div class="article-modal-content">
            <button class="article-modal-close" onclick="closeArticleModal()"><i class="fas fa-times"></i></button>
            <h1 id="article-title">文章标题</h1>
            <div id="article-body" class="markdown-body"></div>
        </div>
    </div>

    <script>
        // 配置
        const USER = 'LafiteLF';
        const REPO = 'LafiteLF.github.io';
        const BLOG_DIR = 'blog'; // 你的文章目录名
        const TOP_FILE = 'top.md';

        // 公共函数：获取原始文本（关键修复！）
        async function fetchRawText(path) {
            const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${path}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.text();
            } catch (err) {
                console.error('获取文件失败:', path, err);
                return null;
            }
        }

        // 1. 加载置顶公告
        async function loadTopContent() {
            const el = document.getElementById('top-content');
            const text = await fetchRawText(TOP_FILE);
            if (text) {
                el.innerHTML = marked.parse(text);
            } else {
                el.innerHTML = `<p style="color:#ff7eb3; font-style:italic;">未找到 ${TOP_FILE} 或加载失败</p>`;
            }
            document.querySelector('.left-panel').classList.add('visible');
        }

        // 2. 加载文章列表
        async function loadBlogList() {
            const listEl = document.getElementById('blog-list');
            const text = await fetchRawText(`${BLOG_DIR}/index.json`);
            let files = [];

            if (text) {
                try {
                    files = JSON.parse(text);
                } catch (e) {
                    console.warn('index.json 解析失败，回退到目录扫描');
                }
            }

            // 如果没有 index.json，则扫描目录
            if (files.length === 0) {
                try {
                    const dirRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${BLOG_DIR}`);
                    const dirData = await dirRes.json();
                    files = dirData.filter(f => f.name.endsWith('.md')).map(f => ({
                        name: f.name,
                        path: f.path,
                        sha: f.sha
                    }));
                } catch (e) {
                    console.error('目录扫描失败', e);
                    listEl.innerHTML = '<p style="text-align:center; opacity:0.6;">无法加载文章列表</p>';
                    document.querySelector('.blog-list').classList.add('visible');
                    return;
                }
            }

            // 按文件名倒序（最新在前）
            files.sort((a, b) => b.name.localeCompare(a.name));

            listEl.innerHTML = '';
            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                const title = file.name.replace('.md', '');
                item.innerHTML = `
                    <h3>${title}</h3>
                    <div class="date"><i class="far fa-calendar-alt"></i> ${file.name.split('-')[0]}</div>
                `;
                item.onclick = () => openArticleModal(file.path, title);
                listEl.appendChild(item);
            });

            document.querySelector('.blog-list').classList.add('visible');
        }

        // 3. 打开文章模态框
        async function openArticleModal(path, title) {
            const modal = document.getElementById('article-modal');
            const titleEl = document.getElementById('article-title');
            const bodyEl = document.getElementById('article-body');

            titleEl.textContent = title;
            bodyEl.innerHTML = '<p style="opacity:0.6;">加载中...</p>';

            const text = await fetchRawText(path);
            if (text) {
                bodyEl.innerHTML = marked.parse(text);
            } else {
                bodyEl.innerHTML = `<p style="color:#ff7eb3;">文章内容加载失败，请检查路径：${path}</p>`;
            }

            modal.classList.add('active');
            modal.style.pointerEvents = 'auto';
        }

        // 4. 关闭文章模态框
        function closeArticleModal() {
            document.getElementById('article-modal').classList.remove('active');
            setTimeout(() => {
                document.getElementById('article-modal').style.pointerEvents = 'none';
            }, 400);
        }

        // 5. 打开归档弹窗
        async function openArchive() {
            const modal = document.getElementById('archive-modal');
            const listEl = document.getElementById('archive-list');
            listEl.innerHTML = '<p style="padding:20px; text-align:center; opacity:0.6;">加载中...</p>';

            const text = await fetchRawText(`${BLOG_DIR}/index.json`);
            let files = [];

            if (text) {
                try {
                    files = JSON.parse(text);
                } catch (e) {}
            }

            if (files.length === 0) {
                try {
                    const dirRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${BLOG_DIR}`);
                    const dirData = await dirRes.json();
                    files = dirData.filter(f => f.name.endsWith('.md'));
                } catch (e) {
                    listEl.innerHTML = '<p style="color:#ff7eb3;">加载失败</p>';
                    return;
                }
            }

            listEl.innerHTML = '';
            files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'archive-item';
                const title = file.name.replace('.md', '');
                div.innerHTML = `<i class="fas fa-book-open"></i> ${title}`;
                div.onclick = () => {
                    closeArchive();
                    openArticleModal(file.path, title);
                };
                listEl.appendChild(div);
            });

            modal.classList.add('active');
        }

        // 6. 关闭归档弹窗
        function closeArchive() {
            document.getElementById('archive-modal').classList.remove('active');
        }

        // 7. 页面加载完成
        window.addEventListener('DOMContentLoaded', () => {
            // 触发动画
            setTimeout(() => {
                document.querySelectorAll('.animate-in').forEach(el => el.classList.add('visible'));
                document.querySelector('.bottom-nav').classList.add('visible');
            }, 200);

            // 加载数据
            loadTopContent();
            loadBlogList();
        });

        // 8. 便捷刷新
        function reloadPage() {
            location.reload();
        }
    </script>
</body>
</html>
