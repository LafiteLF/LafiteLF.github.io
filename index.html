<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- CSS 样式部分 --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --blur-strength: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 玻璃拟态通用类 --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        /* --- 头部区域 --- */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-top: 20px;
            width: 90%;
            max-width: 500px;
            animation: float 6s ease-in-out infinite;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .avatar:hover { transform: rotate(360deg); }

        h1 { font-size: 24px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; }
        .subtitle { font-size: 14px; opacity: 0.8; font-weight: 300; }

        /* --- 内容区域 --- */
        #main-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin-bottom: 80px; /* 为底部导航留出空间 */
        }

        .content-card {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            line-height: 1.8;
            font-size: 16px;
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.5s ease;
        }

        .content-card.active { display: block; }

        /* Markdown 内容样式 */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 20px; margin-bottom: 10px; }
        .markdown-body p { margin-bottom: 15px; }
        .markdown-body code { background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        .markdown-body pre { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 15px; }
        .markdown-body img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        .markdown-body blockquote { border-left: 4px solid var(--glass-highlight); padding-left: 15px; opacity: 0.8; font-style: italic; }

        /* --- 列表样式 (归档/下载) --- */
        .list-item {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            transition: background 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: var(--glass-highlight); }

        .file-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .item-info { flex: 1; text-align: left; }
        .item-title { font-size: 16px; font-weight: 500; display: block; }
        .item-meta { font-size: 12px; opacity: 0.6; margin-top: 4px; display: block; }

        /* --- 底部导航 --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 100;
        }

        .nav-item {
            color: rgba(255,255,255,0.7);
            font-size: 24px;
            padding: 10px;
            transition: all 0.3s;
            text-decoration: none;
            position: relative;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            transform: translateY(-3px);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
        }

        /* --- 动画 --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 返回按钮 --- */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-btn:hover { opacity: 1; }

        /* Loading */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 头部 -->
    <header class="header glass-panel">
        <!-- 头像已更新为你提供的链接 -->
        <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar" class="avatar">
        <h1>LafiteLF's Blog</h1>
        <p class="subtitle">探索数字边界 · 记录生活点滴</p>
    </header>

    <!-- 主内容区 -->
    <div id="main-container">
        <!-- 文章列表 (首页) -->
        <div id="home-view" class="content-card active">
            <div class="loader" id="home-loader"></div>
            <div id="posts-list"></div>
        </div>

        <!-- 文章详情 -->
        <div id="post-view" class="content-card glass-panel">
            <div class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> 返回列表</div>
            <div id="post-content" class="markdown-body"></div>
        </div>

        <!-- 归档面板 -->
        <div id="archive-view" class="content-card glass-panel">
            <div class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> 返回首页</div>
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
                <i class="fas fa-archive"></i> 文章归档
            </h3>
            <div id="archive-list"></div>
        </div>

        <!-- 下载/文件查看器面板 -->
        <div id="download-view" class="content-card glass-panel">
            <div class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> 返回首页</div>
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
                <i class="fas fa-download"></i> 资源下载
            </h3>
            <div style="padding: 0 10px; font-size: 14px; opacity: 0.8; margin-bottom: 15px;">
                <i class="fas fa-info-circle"></i> 以下文件均来自仓库 <code>download/</code> 目录
            </div>
            <div id="download-list">
                <div style="text-align:center; padding: 20px; opacity: 0.6;">点击按钮加载文件...</div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav glass-panel">
        <a href="#" class="nav-item active" onclick="switchTab('home')" title="首页"><i class="fas fa-home"></i></a>
        <a href="#" class="nav-item" onclick="switchTab('archive')" title="归档"><i class="fas fa-archive"></i></a>
        <a href="#" class="nav-item" onclick="switchTab('download')" title="下载"><i class="fas fa-download"></i></a>
        <a href="https://github.com/LafiteLF" target="_blank" class="nav-item" title="GitHub"><i class="fab fa-github"></i></a>
    </nav>

    <script>
        // 配置
        const GITHUB_USER = 'LafiteLF'; // 你的 GitHub 用户名
        const GITHUB_REPO = 'LafiteLF.github.io'; // 你的仓库名
        const BLOG_PATH = 'blog'; // 博客文章存放的文件夹
        const DOWNLOAD_PATH = 'download'; // 下载文件存放的文件夹

        // 页面加载时初始化
        window.onload = function() {
            fetchPosts();
        };

        // --- 核心功能：获取文章列表 ---
        async function fetchPosts() {
            const listContainer = document.getElementById('posts-list');
            const archiveContainer = document.getElementById('archive-list');
            const loader = document.getElementById('home-loader');
            loader.style.display = 'block';

            try {
                // 请求 GitHub API 获取文件列表
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BLOG_PATH}`);

                if (!response.ok) throw new Error('无法连接到 GitHub API');

                const files = await response.json();
                // 过滤只保留 markdown 文件
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                let homeHTML = '';
                let archiveHTML = '';

                mdFiles.forEach(file => {
                    // 从文件名提取标题和日期 (假设文件名格式: 2023-10-01-title.md)
                    const nameParts = file.name.replace('.md', '').split('-');
                    const date = nameParts.length > 2 ? nameParts.slice(0, 3).join('-') : '未知日期';
                    const title = nameParts.length > 2 ? nameParts.slice(3).join(' ') : nameParts.join(' ');

                    const item = `
                        <div class="list-item" onclick="loadPost('${file.path}', '${title}')">
                            <div class="item-info">
                                <span class="item-title">${title}</span>
                                <span class="item-meta"><i class="far fa-clock"></i> ${date}</span>
                            </div>
                            <i class="fas fa-chevron-right" style="opacity: 0.5;"></i>
                        </div>
                    `;
                    homeHTML += item;
                    archiveHTML += item;
                });

                listContainer.innerHTML = homeHTML || '<div style="padding:20px; text-align:center;">暂无文章，请在 blog/ 文件夹添加 Markdown 文件</div>';
                archiveContainer.innerHTML = archiveHTML || '<div style="padding:20px; text-align:center;">归档为空</div>';

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `<div style="color: #ffaaaa; padding: 20px; text-align: center;">
                    <i class="fas fa-exclamation-triangle"></i> 加载失败<br>
                    <small>${error.message}</small>
                </div>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- 核心功能：读取并显示文章 (修复了乱码问题) ---
        async function loadPost(path, title) {
            // UI 切换
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('archive-view').classList.remove('active');
            document.getElementById('download-view').classList.remove('active');
            document.querySelector('.bottom-nav').style.display = 'none'; // 隐藏底部导航

            const postView = document.getElementById('post-view');
            const contentDiv = document.getElementById('post-content');
            postView.classList.add('active');
            contentDiv.innerHTML = '<div class="loader" style="display:block; margin: 50px auto;"></div>';

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`);
                const data = await response.json();

                if (data.content) {
                    // --- 修复乱码的关键代码 ---
                    // 1. Base64 解码
                    const binaryString = atob(data.content);
                    // 2. 转为 Uint8Array
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    // 3. 使用 TextDecoder 强制指定 UTF-8 解码
                    const decoder = new TextDecoder('utf-8');
                    const text = decoder.decode(bytes);

                    // 4. 渲染 Markdown
                    contentDiv.innerHTML = `
                        <h2 style="margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
                            ${title}
                        </h2>
                        <div class="markdown-body">${marked.parse(text)}</div>
                    `;
                }
            } catch (err) {
                contentDiv.innerHTML = '<p style="color:red; text-align:center;">加载文章失败</p>';
            }
        }

        // --- 新功能：加载下载列表 ---
        async function loadDownloadList() {
            const listContainer = document.getElementById('download-list');
            listContainer.innerHTML = '<div style="text-align:center; padding: 20px;"><div class="loader" style="display:inline-block;"></div></div>';

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DOWNLOAD_PATH}`);

                if (response.status === 404) {
                    listContainer.innerHTML = '<div style="padding:20px; text-align:center; color: #ffaaaa;">未找到 download/ 文件夹<br>请在仓库根目录创建它</div>';
                    return;
                }

                if (!response.ok) throw new Error('API Error');

                const files = await response.json();

                if (files.length === 0) {
                    listContainer.innerHTML = '<div style="padding:20px; text-align:center; opacity: 0.6;">文件夹是空的</div>';
                    return;
                }

                let html = '';
                files.forEach(file => {
                    // 根据后缀名判断图标
                    let icon = 'fa-file';
                    let color = '#fff';
                    const name = file.name.toLowerCase();

                    if (name.endsWith('.zip') || name.endsWith('.rar') || name.endsWith('.7z')) {
                        icon = 'fa-file-archive'; color = '#e74c3c';
                    } else if (name.endsWith('.pdf')) {
                        icon = 'fa-file-pdf'; color = '#e74c3c';
                    } else if (name.endsWith('.jpg') || name.endsWith('.png') || name.endsWith('.gif')) {
                        icon = 'fa-file-image'; color = '#2ecc71';
                    } else if (name.endsWith('.exe') || name.endsWith('.msi')) {
                        icon = 'fa-file-code'; color = '#3498db';
                    } else if (name.endsWith('.mp4') || name.endsWith('.mov')) {
                        icon = 'fa-file-video'; color = '#9b59b6';
                    }

                    html += `
                        <a href="${file.html_url}?raw=true" target="_blank" style="text-decoration:none; color:inherit;">
                            <div class="list-item">
                                <div class="file-icon" style="color: ${color}">
                                    <i class="fas ${icon}"></i>
                                </div>
                                <div class="item-info">
                                    <span class="item-title">${file.name}</span>
                                    <span class="item-meta">${(file.size / 1024).toFixed(2)} KB</span>
                                </div>
                                <i class="fas fa-download" style="opacity: 0.5;"></i>
                            </div>
                        </a>
                    `;
                });
                listContainer.innerHTML = html;

            } catch (error) {
                listContainer.innerHTML = '<div style="color: #ffaaaa; text-align:center;">加载失败</div>';
            }
        }

        // --- 导航逻辑 ---
        function switchTab(tab) {
            // 隐藏所有视图
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('post-view').classList.remove('active');
            document.getElementById('archive-view').classList.remove('active');
            document.getElementById('download-view').classList.remove('active');

            // 移除所有激活状态
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('home-view').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (tab === 'archive') {
                document.getElementById('archive-view').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (tab === 'download') {
                document.getElementById('download-view').classList.add('active');
                event.currentTarget.classList.add('active');
                loadDownloadList(); // 点击时加载文件列表
            }
        }

        function goHome() {
            document.querySelectorAll('.content-card').forEach(el => el.classList.remove('active'));
            document.getElementById('home-view').classList.add('active');
            document.querySelector('.bottom-nav').style.display = 'flex';

            // 重置导航高亮
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector('.nav-item[onclick="switchTab(\'home\')"]').classList.add('active');
        }
    </script>
</body>
</html>
