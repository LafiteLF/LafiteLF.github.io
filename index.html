<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 核心样式 (完全保留你的 UI 风格) --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --blur-strength: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            /* 你的粉色渐变背景 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border-radius: 24px; /* 统一圆角 */
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 600px; /* 限制最大宽度 */
            margin: 20px auto;
            padding: 30px;
            text-align: center;
            animation: floatUp 0.8s ease-out;
        }

        /* 头像与标题 */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        .bio { font-size: 0.9rem; opacity: 0.9; }

        /* 文章卡片列表 */
        .post-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .post-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .post-title { font-weight: 600; margin-bottom: 5px; font-size: 1.1rem; }
        .post-date { font-size: 0.8rem; opacity: 0.7; margin-bottom: 10px; display: block; }
        .post-excerpt { font-size: 0.9rem; opacity: 0.8; line-height: 1.5; }

        /* 文章内容页 */
        .article-view { text-align: left; position: relative; }
        .back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.2);
            width: 35px; height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); }

        .content-body { margin-top: 20px; line-height: 1.8; font-size: 1rem; }
        .content-body img { max-width: 100%; border-radius: 12px; margin: 15px 0; }
        .content-body h1, .content-body h2 { margin-top: 25px; margin-bottom: 10px; font-weight: 600; }
        .content-body p { margin-bottom: 15px; }

        /* 底部导航栏 (纯图标) */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 0 10px;
        }

        .nav-item {
            color: var(--text-primary);
            font-size: 1.4rem;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* 归档列表样式 */
        .archive-list { list-style: none; text-align: left; }
        .archive-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .archive-link { text-decoration: none; color: white; display: flex; justify-content: space-between; }
        .archive-link:hover { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="app">
        <!-- 头部信息 -->
        <header class="liquid-glass">
            <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar" class="avatar">
            <h1>LafiteLF's Blog</h1>
            <p class="bio">探索数字边界 · 记录生活点滴</p>
        </header>

        <!-- 动态内容区域 -->
        <main id="content-area" class="liquid-glass">
            <!-- JS 会在这里渲染内容 -->
            <p>加载中...</p>
        </main>
    </div>

    <!-- 底部导航栏 (纯图标) -->
    <nav class="bottom-nav">
        <a href="#/" class="nav-item" onclick="loadHome()"><i class="fas fa-home"></i></a>
        <a href="#/archive" class="nav-item" onclick="loadArchive()"><i class="fas fa-archive"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i></a>
        <a href="https://github.com/LafiteLF" target="_blank" class="nav-item"><i class="fab fa-github"></i></a>
    </nav>

    <script>
        // ==========================================
        // ⚙️ 修复后的逻辑配置
        // ==========================================
        const CONFIG = {
            username: 'LafiteLF',
            repo: 'LafiteLF.github.io', // 你的仓库名
            path: 'blog' // 你的 Markdown 文件夹
        };

        const contentArea = document.getElementById('content-area');

        // 初始化路由
        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);

        function router() {
            const hash = window.location.hash;
            if (!hash || hash === '#/') {
                loadHome();
            } else if (hash.startsWith('#/post/')) {
                const fileName = hash.replace('#/post/', '');
                loadArticle(fileName);
            } else if (hash === '#/archive') {
                loadArchive();
            }
        }

        // 1. 加载首页 (文章列表)
        async function loadHome() {
            contentArea.innerHTML = '<p>正在加载文章列表...</p>';

            try {
                // 使用 GitHub Contents API
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`);

                if (!res.ok) throw new Error('无法连接到 GitHub 仓库，请检查网络或仓库设置');

                const files = await res.json();
                // 过滤 Markdown 文件并按时间倒序
                const posts = files
                    .filter(f => f.name.endsWith('.md'))
                    .sort((a, b) => new Date(b.sha) - new Date(a.sha)); // 简单的排序，依赖提交时间或文件名

                if (posts.length === 0) {
                    contentArea.innerHTML = '<p>博客文件夹是空的，快去写第一篇吧！</p>';
                    return;
                }

                let html = '';
                posts.forEach(file => {
                    // 简单提取标题（去掉.md后缀）
                    const title = file.name.replace('.md', '');
                    html += `
                        <div class="post-card" onclick="window.location.hash='#/post/${file.name}'">
                            <h3 class="post-title">${title}</h3>
                            <span class="post-date"><i class="far fa-clock"></i> 点击阅读</span>
                            <p class="post-excerpt">查看关于 ${title} 的详细内容...</p>
                        </div>
                    `;
                });
                contentArea.innerHTML = html;

            } catch (err) {
                contentArea.innerHTML = `
                    <div style="color: #ffcccc;">
                        <i class="fas fa-exclamation-circle"></i> 加载失败<br>
                        <small>${err.message}</small>
                    </div>`;
            }
        }

        // 2. 加载归档页面
        async function loadArchive() {
            contentArea.innerHTML = '<p>正在加载归档...</p>';

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`);
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                let html = '<h2><i class="fas fa-archive"></i> 文章归档</h2><ul class="archive-list">';
                posts.forEach(file => {
                    const title = file.name.replace('.md', '');
                    html += `
                        <li class="archive-item">
                            <a href="#/post/${file.name}" class="archive-link">
                                <span>${title}</span>
                                <i class="fas fa-chevron-right" style="font-size: 0.8rem;"></i>
                            </a>
                        </li>
                    `;
                });
                html += '</ul>';
                contentArea.innerHTML = html;

            } catch (err) {
                contentArea.innerHTML = '<p>归档加载失败</p>';
            }
        }

        // 3. 加载文章内容 + 下载功能
        async function loadArticle(fileName) {
            contentArea.innerHTML = '<p>正在加载文章...</p>';

            try {
                // 第一步：获取文件元数据
                const metaRes = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}/${fileName}`);
                const metaData = await metaRes.json();

                // 第二步：获取文件原始内容
                const contentRes = await fetch(metaData.download_url);
                const text = await contentRes.text();

                // 解析 Markdown
                const htmlContent = marked.parse(text);

                // 渲染页面 (包含下载按钮)
                contentArea.innerHTML = `
                    <div class="article-view">
                        <a href="#/" class="back-btn" title="返回首页"><i class="fas fa-home"></i></a>
                        <a href="${metaData.download_url}" download="${fileName}" class="back-btn" style="top: 10px; right: 55px;" title="下载源码">
                            <i class="fas fa-download"></i>
                        </a>
                        <div class="content-body">
                            ${htmlContent}
                        </div>
                    </div>
                `;

            } catch (err) {
                contentArea.innerHTML = '<p>文章加载失败，文件可能不存在。</p>';
            }
        }
    </script>
</body>
</html>
