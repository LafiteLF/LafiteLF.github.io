<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 核心样式 (保留你的 UI) --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --blur-strength: 12px;
            --corner-radius: 24px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8360c3 0%, #2ebf91 100%); /* 默认渐变 */
            background: linear-gradient(135deg, #d66d75 0%, #e29587 100%); /* 你的粉色系 */
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px; /* 为底部导航留空 */
        }

        /* --- 玻璃拟态卡片 --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border: 1px solid var(--glass-border);
            border-radius: var(--corner-radius);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 20px;
            width: 90%;
            max-width: 600px;
            margin: 20px 0;
            transition: transform 0.2s;
        }

        /* --- 头部 --- */
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--glass-highlight);
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        .subtitle { margin-top: 5px; font-size: 0.9rem; opacity: 0.9; }

        /* --- 文章列表 --- */
        #article-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }
        .article-item {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }
        .article-item:hover {
            background: rgba(255,255,255,0.25);
        }
        .article-icon {
            margin-right: 15px;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .article-info { flex: 1; }
        .article-title { font-weight: 600; margin: 0 0 5px 0; font-size: 1.1rem; }
        .article-meta { font-size: 0.8rem; opacity: 0.7; margin: 0; }

        /* --- 阅读视图 --- */
        #reader-view {
            display: none; /* 默认隐藏 */
            width: 90%;
            max-width: 650px;
            margin-top: 20px;
            position: relative;
        }
        .reader-content {
            line-height: 1.8;
            font-size: 1rem;
            text-align: left;
        }
        .reader-content h1, .reader-content h2, .reader-content h3 { margin-top: 1.5em; }
        .reader-content p { margin-bottom: 1em; }
        .reader-content code { background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px; }
        .reader-content pre { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto; }

        /* --- 顶部工具栏 (返回/下载) --- */
        .reader-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .btn-icon {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.4); }

        /* --- 底部导航栏 --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            gap: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 100;
        }
        .nav-item {
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            opacity: 0.7;
        }
        .nav-item:hover, .nav-item.active {
            opacity: 1;
            transform: scale(1.1);
            color: #fff;
        }

        /* --- 归档弹窗 --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #222; /* 深色背景方便阅读列表 */
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-item {
            padding: 10px 0;
            border-bottom: 1px solid #444;
            color: #fff;
            cursor: pointer;
        }
        .modal-item:hover { color: #d66d75; }
    </style>
</head>
<body>

    <!-- 头部 -->
    <div class="glass-card header">
        <img src="https://avatars.githubusercontent.com/u/170415266" alt="Avatar" class="avatar">
        <h1>LafiteLF's Blog</h1>
        <div class="subtitle">探索数字边界 · 记录生活点滴</div>
    </div>

    <!-- 文章列表视图 -->
    <div id="article-list">
        <!-- JS 会自动填充这里 -->
        <div style="text-align:center; padding: 20px; opacity: 0.7;">
            <i class="fas fa-spinner fa-spin"></i> 正在加载文章...
        </div>
    </div>

    <!-- 阅读视图 -->
    <div id="reader-view" class="glass-card">
        <div class="reader-header">
            <button class="btn-icon" onclick="goHome()"><i class="fas fa-arrow-left"></i></button>
            <h3 id="reader-title" style="margin:0; align-self:center;"></h3>
            <button class="btn-icon" id="download-btn" onclick="downloadCurrentFile()"><i class="fas fa-download"></i></button>
        </div>
        <div id="reader-content" class="reader-content"></div>
    </div>

    <!-- 归档弹窗 -->
    <div id="archive-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <h3 style="margin-top:0; border-bottom:1px solid #444; padding-bottom:10px;">📂 文章归档</h3>
            <div id="archive-list"></div>
        </div>
    </div>

    <!-- 底部导航栏 (不动) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goHome()"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="showArchive()"><i class="fas fa-archive"></i></div> <!-- 归档功能 -->
        <div class="nav-item"><i class="fas fa-user"></i></div>
        <div class="nav-item"><i class="fab fa-github"></i></div>
    </div>

    <script>
        // --- 配置 ---
        const GITHUB_USER = 'LafiteLF'; // 你的 GitHub 用户名
        const GITHUB_REPO = 'LafiteLF.github.io'; // 你的仓库名
        const BLOG_PATH = 'blog'; // 存放 md 文件的文件夹

        // --- 状态 ---
        let allFiles = []; // 存储所有获取到的文件信息

        // --- 初始化 ---
        window.onload = function() {
            fetchFiles();
        };

        // 1. 获取文件列表
        async function fetchFiles() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BLOG_PATH}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('网络响应错误');

                const data = await response.json();
                // 过滤只保留 .md 文件
                allFiles = data.filter(item => item.name.endsWith('.md'));

                if (allFiles.length === 0) {
                    document.getElementById('article-list').innerHTML = '<div style="text-align:center; padding:20px;">暂无文章</div>';
                    return;
                }

                renderList(allFiles);

            } catch (error) {
                console.error(error);
                document.getElementById('article-list').innerHTML = `
                    <div style="text-align:center; padding:20px; color:#ffcccc;">
                        <i class="fas fa-exclamation-circle"></i><br>
                        无法加载文章<br>
                        <small>${error.message}</small>
                    </div>`;
            }
        }

        // 2. 渲染列表
        function renderList(files) {
            const listContainer = document.getElementById('article-list');
            listContainer.innerHTML = ''; // 清空加载动画

            files.forEach(file => {
                // 去掉 .md 后缀作为标题
                const title = file.name.replace('.md', '');

                const item = document.createElement('div');
                item.className = 'article-item';
                item.innerHTML = `
                    <div class="article-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="article-info">
                        <div class="article-title">${title}</div>
                        <div class="article-meta">${file.name}</div> <!-- 显示文件名 -->
                    </div>
                `;
                // 点击跳转阅读
                item.onclick = (e) => {
                    e.stopPropagation();
                    openReader(file);
                };
                listContainer.appendChild(item);
            });
        }

        // 3. 打开阅读器
        async function openReader(file) {
            // 切换视图
            document.getElementById('article-list').style.display = 'none';
            document.querySelector('.header').style.display = 'none';
            const readerView = document.getElementById('reader-view');
            readerView.style.display = 'block';

            // 设置标题
            document.getElementById('reader-title').innerText = file.name.replace('.md', '');

            try {
                // 获取文件具体内容
                const response = await fetch(file.download_url); // 使用 download_url 获取原始内容
                const text = await response.text();

                // 解析 Markdown
                document.getElementById('reader-content').innerHTML = marked.parse(text);

                // 保存当前文件下载链接到按钮
                const downloadBtn = document.getElementById('download-btn');
                downloadBtn.onclick = () => downloadFile(file.download_url, file.name);

            } catch (err) {
                document.getElementById('reader-content').innerHTML = '<p>内容加载失败</p>';
            }
        }

        // 4. 返回首页
        function goHome() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('article-list').style.display = 'flex';
            document.querySelector('.header').style.display = 'block';
        }

        // 5. 下载功能
        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 6. 归档功能 (弹窗)
        function showArchive() {
            const modal = document.getElementById('archive-modal');
            const list = document.getElementById('archive-list');
            list.innerHTML = '';

            if(allFiles.length === 0) {
                list.innerHTML = '<div style="color:#888; padding:10px;">暂无归档</div>';
            } else {
                allFiles.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'modal-item';
                    div.innerText = file.name;
                    div.onclick = (e) => {
                        e.stopPropagation();
                        modal.style.display = 'none';
                        openReader(file);
                    };
                    list.appendChild(div);
                });
            }
            modal.style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'archive-modal') {
                e.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
