<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 全局样式 --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --blur-amount: 12px;
            --transition-speed: 0.3s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 顶部装饰 --- */
        .top-decor {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: url('https://avatars.githubusercontent.com/u/187166523?s=96&v=4') no-repeat center/cover;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 10;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- 主容器布局 --- */
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            margin-top: 120px;
            gap: 20px;
            flex: 1;
        }

        /* --- 左侧 Top Panel --- */
        .left-panel {
            flex: 1;
            max-width: 500px;
            height: 600px; /* 巨大的高度 */
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            overflow-y: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s forwards ease-out;
        }

        .left-panel h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--glass-highlight);
            padding-bottom: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--glass-highlight); }
        .markdown-body a { color: #89CFF0; text-decoration: none; }
        .markdown-body code { background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px; }

        /* --- 右侧 Blog List --- */
        .right-panel {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* 关键：靠右对齐 */
        }

        .profile-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            margin-bottom: 20px;
            animation: slideDownFade 0.6s forwards ease-out;
        }

        .profile-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--glass-highlight);
            margin-bottom: 15px;
        }

        .profile-card h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .profile-card p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .blog-list {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-height: 600px;
            overflow-y: auto;
            animation: slideUpFade 0.6s 0.2s forwards ease-out;
            opacity: 0;
        }

        .blog-item {
            background: var(--glass-highlight);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid transparent;
        }

        .blog-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--glass-border);
        }

        .blog-item h3 {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: 500;
        }

        .blog-item .date {
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 底部导航栏 (不动) --- */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 100;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: translateY(100px);
        }

        .nav-item {
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            position: relative;
        }

        .nav-item:hover {
            transform: translateY(-3px) scale(1.1);
            color: var(--glass-highlight);
        }

        /* --- 归档弹窗 --- */
        .archive-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 从底部弹出 */
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .archive-content {
            background: #1a1a2e;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 30px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-height: 80vh;
            overflow-y: auto;
            border-top: 1px solid var(--glass-border);
        }

        .archive-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .archive-modal.active .archive-content {
            transform: translateY(0);
        }

        .archive-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        .archive-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* --- 动画定义 --- */
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDownFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- 顶部装饰头像 -->
    <div class="top-decor"></div>

    <!-- 主容器：左右布局 -->
    <div class="main-container">

        <!-- 左侧：Top Panel (显示 top.md) -->
        <div class="left-panel">
            <h2><i class="fas fa-thumbtack"></i> 置顶公告</h2>
            <div id="top-content" class="markdown-body">
                <!-- top.md 内容将加载到这里 -->
                <p style="opacity: 0.6; font-style: italic;">正在加载置顶内容...</p>
            </div>
        </div>

        <!-- 右侧：原有 Blog 内容 (靠右对齐) -->
        <div class="right-panel">
            <div class="profile-card">
                <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar">
                <h1>LafiteLF's Blog</h1>
                <p>探索数字边界 · 记录生活点滴</p>
            </div>

            <div class="blog-list" id="blog-list">
                <!-- 文章列表将加载到这里 -->
            </div>
        </div>

    </div>

    <!-- 底部导航栏 (保持原样) -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="openArchive()"><i class="fas fa-archive"></i></div>
        <div class="nav-item" onclick="alert('功能开发中')"><i class="fas fa-user"></i></div>
        <div class="nav-item" onclick="window.open('https://github.com/LafiteLF')"><i class="fab fa-github"></i></div>
    </div>

    <!-- 归档弹窗 -->
    <div class="archive-modal" id="archive-modal" onclick="closeArchive(event)">
        <div class="archive-content">
            <h2 style="color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0;">
                <i class="fas fa-file-alt"></i> 文章归档
            </h2>
            <div id="archive-list">
                <!-- 归档列表 -->
            </div>
        </div>
    </div>

    <script>
        // 配置部分
        const GITHUB_USER = 'LafiteLF'; // 你的 GitHub 用户名
        const REPO_NAME = 'YourRepoName'; // 你的仓库名 (请确保替换正确，如果是个人主页通常是 username.github.io)
        const BRANCH = 'main'; // 分支名

        // 如果是在 GitHub Pages 上运行，可以通过 window.location 自动推断，或者硬编码
        // 这里为了演示，使用硬编码，请根据实际情况修改
        // 假设你的仓库名和用户名一致，或者根据实际情况填写
        const repo = `${GITHUB_USER}/${REPO_NAME}`;

        // 1. 加载置顶文件 (top.md)
        async function loadTopFile() {
            try {
                // 尝试获取根目录下的 top.md
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/top.md`);
                if (!response.ok) throw new Error('Not found');

                const data = await response.json();
                const content = atob(data.content); // 解码 Base64
                document.getElementById('top-content').innerHTML = marked.parse(content);
            } catch (error) {
                document.getElementById('top-content').innerHTML = `<p style="color: #ff6b6b;"><i class="fas fa-exclamation-circle"></i> 未找到 top.md 或加载失败</p>`;
            }
        }

        // 2. 加载文章列表
        async function loadBlogList() {
            const listContainer = document.getElementById('blog-list');
            try {
                // 假设文章在 /blog 文件夹下，如果没有文件夹则改为 ''
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/blog`);
                const files = await response.json();

                // 过滤出 .md 文件
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    listContainer.innerHTML = '<div style="padding:20px; text-align:center; opacity:0.6;">暂无文章</div>';
                    return;
                }

                // 生成列表
                mdFiles.forEach(file => {
                    // 提取标题（去掉 .md 后缀）
                    const title = file.name.replace('.md', '');
                    // 简单处理日期（假设文件名包含日期）
                    const date = title;

                    const item = document.createElement('div');
                    item.className = 'blog-item';
                    item.innerHTML = `
                        <h3>${title}</h3>
                        <div class="date"><i class="far fa-file-alt"></i> ${date}</div>
                    `;
                    // 点击跳转到文章内容（这里简单处理为打开 GitHub 链接或实现单页阅读）
                    // 为了保持单页体验，这里假设有一个 readArticle 函数
                    item.onclick = () => readArticle(file.path, title);
                    listContainer.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = '<div style="padding:20px; color:#ff6b6b;">加载文章列表失败</div>';
            }
        }

        // 3. 加载归档列表 (修复归档功能)
        async function loadArchiveList() {
            const listContainer = document.getElementById('archive-list');
            listContainer.innerHTML = ''; // 清空旧内容
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/blog`);
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                mdFiles.forEach(file => {
                    const title = file.name.replace('.md', '');
                    const div = document.createElement('div');
                    div.className = 'archive-item';
                    div.innerHTML = `<i class="fas fa-book-open"></i> ${title}`;
                    div.onclick = (e) => {
                        e.stopPropagation(); // 防止触发关闭
                        closeArchive();
                        readArticle(file.path, title);
                    };
                    listContainer.appendChild(div);
                });

            } catch (error) {
                listContainer.innerHTML = '<div style="color:#ff6b6b; padding:10px;">加载失败</div>';
            }
        }

        // 4. 阅读文章逻辑
        async function readArticle(filePath, title) {
            // 这里简单实现：直接打开 GitHub 上的 raw 文件链接，或者你可以写一个更复杂的 Modal 阅读器
            // 为了演示，我们打开 raw 链接
            const rawUrl = `https://raw.githubusercontent.com/${repo}/${BRANCH}/${filePath}`;
            window.open(rawUrl, '_blank');
        }

        // 5. 归档弹窗控制
        function openArchive() {
            const modal = document.getElementById('archive-modal');
            modal.classList.add('active');
            loadArchiveList(); // 打开时加载列表
        }

        function closeArchive(e) {
            const modal = document.getElementById('archive-modal');
            // 点击背景关闭
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        }

        // 初始化
        loadTopFile();
        loadBlogList();

    </script>
</body>
</html>
