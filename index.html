<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 核心样式 (保留你的 UI) --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --primary-color: #ff7eb3; /* 你的粉色主题 */
            --transition-speed: 0.3s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* --- 布局容器 --- */
        .main-container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- 左侧 Top Panel --- */
        .top-panel {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-right: 20px;
            overflow-y: auto;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform var(--transition-speed) ease;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s forwards;
        }

        .top-panel h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* --- 右侧 Blog 区域 --- */
        .blog-container {
            width: 350px; /* 固定宽度，保持原有大小 */
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-end; /* 靠右对齐 */
        }

        .profile-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform var(--transition-speed) ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            background: var(--glass-highlight);
        }

        .profile-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .profile-card h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 600;
        }

        .profile-card p {
            margin: 5px 0 0;
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* --- 文章列表 --- */
        .article-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .article-item {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
        }

        .article-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-color);
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
        }

        .article-item:hover {
            transform: translateX(-5px);
            background: var(--glass-highlight);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .article-item:hover::before {
            opacity: 1;
        }

        .article-title {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .article-date {
            font-size: 0.8em;
            opacity: 0.6;
        }

        /* --- 底部导航栏 --- */
        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 10px 25px;
            display: flex;
            gap: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .dock-item {
            color: var(--text-primary);
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            opacity: 0.7;
        }

        .dock-item:hover {
            transform: translateY(-5px) scale(1.2);
            color: var(--primary-color);
            opacity: 1;
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* --- 归档弹窗 (修复动画) --- */
        .archive-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 从底部弹出 */
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .archive-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .archive-content {
            background: #1a1a2e;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .archive-modal.active .archive-content {
            transform: translateY(0);
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .archive-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .archive-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* --- 动画 --- */
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 左侧：置顶公告 -->
        <div class="top-panel">
            <h2>置顶公告</h2>
            <div id="top-content">加载中...</div>
        </div>

        <!-- 右侧：博客列表 -->
        <div class="blog-container">
            <div class="profile-card">
                <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar">
                <h1>LafiteLF's Blog</h1>
                <p>探索数字边界 · 记录生活点滴</p>
            </div>

            <div class="article-list" id="article-list">
                <!-- 文章将通过 JS 动态插入 -->
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="dock">
        <div class="dock-item" onclick="location.reload()"><i class="fas fa-home"></i></div>
        <div class="dock-item" onclick="openArchive()"><i class="fas fa-archive"></i></div>
        <div class="dock-item" onclick="alert('功能开发中')"><i class="fas fa-user"></i></div>
        <div class="dock-item" onclick="alert('功能开发中')"><i class="fab fa-github"></i></div>
    </div>

    <!-- 归档弹窗 -->
    <div class="archive-modal" id="archive-modal">
        <div class="archive-content">
            <div class="archive-header">
                <h3>文章归档</h3>
                <div class="dock-item" onclick="closeArchive()"><i class="fas fa-times"></i></div>
            </div>
            <div id="archive-list">
                <!-- 归档列表 -->
            </div>
        </div>
    </div>

    <script>
        // 配置
        const GITHUB_USER = 'LafiteLF';
        const GITHUB_REPO = 'LafiteLF.github.io'; // 你的仓库名
        const BLOG_PATH = 'blog'; // 你的文章文件夹路径
        const TOP_MD = 'top.md'; // 根目录下的置顶文件

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadTopMarkdown();
            loadArticles();
        });

        // 1. 加载置顶公告 (修复乱码)
        async function loadTopMarkdown() {
            const contentDiv = document.getElementById('top-content');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${TOP_MD}`);
                if (!response.ok) throw new Error('File not found');
                const data = await response.json();
                // 核心修复：Base64 解码
                const decodedContent = atob(data.content);
                contentDiv.innerHTML = marked.parse(decodedContent);
            } catch (error) {
                contentDiv.innerHTML = '<p style="color:#ff7eb3">暂无置顶公告或文件读取失败</p>';
            }
        }

        // 2. 加载文章列表
        async function loadArticles() {
            const listContainer = document.getElementById('article-list');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BLOG_PATH}`);
                const files = await response.json();

                // 过滤 markdown 文件并排序
                const mdFiles = files.filter(f => f.name.endsWith('.md')).sort((a, b) => b.name.localeCompare(a.name));

                listContainer.innerHTML = '';
                mdFiles.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'article-item';
                    // 去掉 .md 后缀作为标题
                    const title = file.name.replace('.md', '');

                    item.innerHTML = `
                        <div class="article-title">${title}</div>
                        <div class="article-date">${file.name}</div>
                    `;

                    // 绑定点击事件
                    item.onclick = () => loadArticleContent(file.path, title);
                    listContainer.appendChild(item);
                });
            } catch (error) {
                listContainer.innerHTML = '<p style="text-align:center; opacity:0.6">加载文章列表失败</p>';
            }
        }

        // 3. 加载文章内容
        async function loadArticleContent(filePath, title) {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filePath}`);
                const data = await response.json();
                // 核心修复：Base64 解码
                const decodedContent = atob(data.content);

                // 简单的弹窗展示（你可以换成更复杂的模态框）
                const modal = document.createElement('div');
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.background = 'rgba(0,0,0,0.8)';
                modal.style.backdropFilter = 'blur(5px)';
                modal.style.zIndex = '3000';
                modal.style.display = 'flex';
                modal.style.justifyContent = 'center';
                modal.style.alignItems = 'center';
                modal.style.overflow = 'auto';

                const contentBox = document.createElement('div');
                contentBox.style.background = '#1a1a2e';
                contentBox.style.padding = '30px';
                contentBox.style.borderRadius = '15px';
                contentBox.style.maxWidth = '80%';
                contentBox.style.maxHeight = '80%';
                contentBox.style.overflowY = 'auto';
                contentBox.innerHTML = `<h2>${title}</h2><hr style="border-color:#333"><div>${marked.parse(decodedContent)}</div>`;

                const closeBtn = document.createElement('button');
                closeBtn.innerText = '关闭';
                closeBtn.style.marginTop = '20px';
                closeBtn.style.padding = '10px 20px';
                closeBtn.onclick = () => document.body.removeChild(modal);

                contentBox.appendChild(closeBtn);
                modal.appendChild(contentBox);
                document.body.appendChild(modal);

            } catch (error) {
                alert('读取文章内容失败');
            }
        }

        // 4. 归档功能 (修复弹窗)
        function openArchive() {
            const modal = document.getElementById('archive-modal');
            const list = document.getElementById('archive-list');
            list.innerHTML = '加载中...';
            modal.classList.add('active');

            // 重新获取列表填充到归档
            fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${BLOG_PATH}`)
                .then(res => res.json())
                .then(files => {
                    const mdFiles = files.filter(f => f.name.endsWith('.md')).sort((a, b) => b.name.localeCompare(a.name));
                    list.innerHTML = '';
                    mdFiles.forEach(file => {
                        const div = document.createElement('div');
                        div.className = 'archive-item';
                        div.innerText = file.name.replace('.md', '');
                        div.onclick = () => {
                            closeArchive();
                            loadArticleContent(file.path, file.name.replace('.md', ''));
                        };
                        list.appendChild(div);
                    });
                });
        }

        function closeArchive() {
            document.getElementById('archive-modal').classList.remove('active');
        }
    </script>
</body>
</html>
