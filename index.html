<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LafiteLF's Liquid Blog</title>
    <!-- 引入图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- 全局样式 --- */
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --blur-strength: 15px;
            --main-radius: 24px; /* 统一圆角大小 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            /* 梦幻渐变背景 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding-bottom: 100px; /* 为底部导航留出空间 */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 通用毛玻璃卡片类 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border-radius: var(--main-radius);
            overflow: hidden;
            position: relative;
        }

        .container { max-width: 750px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

        /* --- 头部样式 --- */
        header {
            text-align: center;
            padding: 40px 20px;
            margin: 40px 20px 30px;
            animation: floatUp 0.8s ease-out;
        }
        
        .avatar { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid rgba(255,255,255,0.6); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px; 
        }

        h1 { font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; font-size: 1.8rem; }
        p.bio { color: var(--text-secondary); font-size: 1rem; font-weight: 400; }

        /* --- 文章列表与详情 --- */
        #content-area { padding-bottom: 20px; }

        .post-card { 
            padding: 25px; 
            margin-bottom: 20px; 
            transition: transform 0.3s ease, background 0.3s ease; 
            cursor: pointer; 
            animation: floatUp 0.8s ease-out backwards; 
        }
        .post-card:hover { 
            transform: scale(1.02) translateY(-3px); 
            background: rgba(255, 255, 255, 0.25); 
        }
        
        .post-date { font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 8px; display: block; }
        .post-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 12px; color: #fff; }
        .post-excerpt { color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 文章详情页样式 */
        .article-view { padding: 30px; animation: floatUp 0.5s ease-out; }
        .back-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); 
            border-radius: 50%; 
            color: white; 
            text-decoration: none; 
            margin-bottom: 20px; 
            transition: 0.3s; 
            backdrop-filter: blur(5px);
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); transform: translateX(-3px); }
        
        .markdown-body { font-size: 1.05rem; line-height: 1.8; color: var(--text-secondary); }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #fff; margin-top: 30px; margin-bottom: 15px; font-weight: 600; }
        .markdown-body p { margin-bottom: 20px; }
        .markdown-body img { max-width: 100%; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .markdown-body blockquote { border-left: 4px solid var(--glass-highlight); padding-left: 15px; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.1); padding: 10px 15px; border-radius: 0 8px 8px 0; margin: 20px 0; }
        .markdown-body pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; overflow-x: auto; margin: 20px 0; }
        .markdown-body code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

        /* --- 底部导航 (纯图标版) --- */
        .bottom-nav { 
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 90%; 
            max-width: 400px; 
            height: 65px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 1000; 
            border-radius: 35px; /* 胶囊形状 */
            animation: floatUp 1s ease-out;
            padding: 0 10px;
        }

        .nav-item { 
            color: var(--text-primary); 
            text-decoration: none; 
            font-size: 1.5rem; /* 图标放大 */
            width: 50px; 
            height: 50px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; /* 圆形点击区 */
            transition: all 0.3s ease; 
            opacity: 0.8;
        }

        .nav-item:hover, .nav-item.active { 
            background: rgba(255, 255, 255, 0.25); 
            transform: scale(1.1); 
            opacity: 1;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* 动画 */
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 错误提示样式 */
        .error-box { text-align: center; padding: 40px; color: #ffdddd; }
        .error-box i { font-size: 2rem; margin-bottom: 10px; display: block; }

        @media (max-width: 600px) {
            .container { padding: 10px; }
            header { margin: 20px 10px; padding: 30px 10px; }
            .bottom-nav { width: 92%; height: 60px; bottom: 15px; }
            .nav-item { width: 45px; height: 45px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- 头部信息 -->
        <header class="glass-card">
            <img src="https://avatars.githubusercontent.com/u/187166523?s=96&v=4" alt="Avatar" class="avatar">
            <h1>LafiteLF's Blog</h1>
            <p class="bio">探索数字边界 · 记录生活点滴</p>
        </header>
        
        <!-- 动态内容区域 -->
        <div id="content-area"></div>
    </div>

    <!-- 底部导航 (纯图标) -->
    <nav class="bottom-nav glass-card">
        <a href="#/" class="nav-item" title="首页"><i class="fas fa-home"></i></a>
        <a href="#" class="nav-item" title="归档"><i class="fas fa-archive"></i></a>
        <a href="#" class="nav-item" title="关于"><i class="fas fa-user"></i></a>
        <a href="https://github.com/LafiteLF" target="_blank" class="nav-item" title="GitHub"><i class="fab fa-github"></i></a>
    </nav>

    <script>
        // ==========================================
        // ⚙️ 配置区域
        // ==========================================
        const CONFIG = {
            username: 'LafiteLF',          
            repo: 'LafiteLF.github.io',    
            path: 'blog'                   
        };

        const contentArea = document.getElementById('content-area');
        // 使用 GitHub Contents API
        const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`;

        // 初始化
        async function init() {
            const hash = window.location.hash;
            
            if (hash.startsWith('#/post/')) {
                const fileName = decodeURIComponent(hash.replace('#/post/', ''));
                loadArticle(fileName);
            } else {
                loadPostList();
            }
        }

        // 1. 加载文章列表
        async function loadPostList() {
            contentArea.innerHTML = '<div style="text-align:center; padding: 40px; color: rgba(255,255,255,0.7);"><i class="fas fa-spinner fa-spin fa-2x"></i><p style="margin-top:15px;">加载中...</p></div>';
            
            try {
                const response = await fetch(apiUrl);
                
                if (response.status === 404) {
                    throw new Error(`找不到 <strong>/${CONFIG.path}</strong> 文件夹<br>请在仓库根目录创建它`);
                }
                if (!response.ok) throw new Error(`连接失败: ${response.status}`);
                
                const data = await response.json();
                
                // 过滤并排序
                const mdFiles = data
                    .filter(file => file.name.endsWith('.md'))
                    .sort((a, b) => b.name.localeCompare(a.name)); // 按文件名倒序

                if (mdFiles.length === 0) {
                     contentArea.innerHTML = `<div class="glass-card error-box"><i class="fas fa-folder-open"></i><p>文件夹是空的<br>请在 <strong>/${CONFIG.path}</strong> 中放入 .md 文件</p></div>`;
                     return;
                }

                let html = '';
                mdFiles.forEach(file => {
                    const title = file.name.replace('.md', ''); 
                    // 简单的日期格式化 (如果文件名包含日期可以优化这里)
                    const date = new Date(file.sha).toLocaleDateString(); 
                    
                    html += `
                        <article class="post-card glass-card" onclick="window.location.hash='#/post/${encodeURIComponent(file.name)}'">
                            <span class="post-date"><i class="far fa-clock"></i> ${date}</span>
                            <h2 class="post-title">${title}</h2>
                            <p class="post-excerpt">点击阅读关于 ${title} 的详细内容...</p>
                        </article>
                    `;
                });
                contentArea.innerHTML = html;

            } catch (error) {
                contentArea.innerHTML = `
                    <div class="glass-card error-box">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>加载失败</h3>
                        <p style="font-size:0.9rem; margin-top:10px; opacity:0.9;">${error.message}</p>
                    </div>
                `;
            }
        }

        // 2. 加载具体文章内容
        async function loadArticle(fileName) {
            contentArea.innerHTML = '<div style="text-align:center; padding: 40px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

            try {
                // 获取文件元数据
                const fileRes = await fetch(`${apiUrl}/${encodeURIComponent(fileName)}`);
                if(!fileRes.ok) throw new Error("文章不存在");
                
                const fileData = await fileRes.json();
                
                // 获取 Markdown 内容
                const mdRes = await fetch(fileData.download_url);
                const markdownText = await mdRes.text();

                // 渲染
                marked.setOptions({
                    breaks: true, // 支持换行
                    gfm: true     // 支持GitHub风格
                });
                const htmlContent = marked.parse(markdownText);
                
                contentArea.innerHTML = `
                    <div class="glass-card article-view">
                        <a href="#/" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                        <div class="markdown-body">
                            <h1 style="margin-top:0;">${fileName.replace('.md', '')}</h1>
                            ${htmlContent}
                        </div>
                    </div>
                `;
                // 滚动到顶部
                window.scrollTo(0, 0);

            } catch (error) {
                contentArea.innerHTML = `<div class="glass-card error-box"><i class="fas fa-file-excel"></i><p>无法加载文章内容</p></div>`;
            }
        }

        // 监听路由
        window.addEventListener('hashchange', init);
        init();
    </script>
</body>
</html>
